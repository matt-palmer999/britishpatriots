- "Home Office's new \"arrival induction\" video is a ten-minute clip of a kettle boiling, caseworkers say it tests for \"patience, not comprehension\""
- "Gerald writes to his MP to complain that the asylum hostel's bin store is painted \"a continental shade of green,\" council confirms the paint is the same tin used on every bin store in the borough since 2015"
- "Gavin Bacon blames \"EU red tape\" for a delay to his neighbour's conservatory, planning office clarifies the hold-up is a missing signature on a council form, which has had nothing to do with Brussels since Brexit"
- "Cultural Policy Foundation report finds British small talk has \"measurably shortened\" since an Italian coffee cart opened near the market square, findings described as \"stark\""
- "GP surgery's new \"patient-first\" booking line plays a recorded message thanking callers for their patience, hold music outlasts the actual appointment that follows"
- "NHS trust renames its waiting list the \"care pathway,\" pathway length unchanged, trust says the new name is \"more reflective of the journey\""
- "Margaret Fenn's parish council unveils a \"heritage trail\" consisting of four laminated signs pointing at the same bus stop from different angles, Fenn says she has \"nothing against bus stops\""
- "District council rebrands its annual deficit a \"investment opportunity gap,\" shortfall identical, spokesperson calls the figure \"more aspirational\""
- "BBC daytime show runs a special on \"Britain's disappearing high street\" filmed entirely inside a shopping centre that opened in March"
- "BBC regional bulletin leads with a \"major incident\" that turns out to be a swan on the ring road, traffic unaffected, swan unharmed"
- "Col. (Ret'd) Brian Fortescue-Hatch warns a Chinese-made thermostat at the bowls club \"could be reporting the nation's room temperatures to Beijing,\" thermostat confirmed broken and stuck on 19 degrees since spring"
- "Seaside council rejects a Chinese-backed pier lighting scheme over \"strategic illumination concerns,\" pier has operated under the same four working bulbs since 2018"
- "Chancellor's new \"cost of living clarity drive\" consists of a larger font on the energy bill, total owed unchanged"
- "Supermarket's \"everyday essentials\" relaunch cuts the own-brand biscuit pack from ten to eight, label now reads \"thoughtfully portioned\""
- "Police force's \"reassurance patrol\" app sends a daily push notification confirming \"all quiet,\" notification sent twice during a reported burglary two streets over"
- "Local swimming club renames its \"advanced\" lane the \"confident movement\" lane, depth, lifeguard and length of the pool all unchanged, committee calls the change \"meaningful\""
