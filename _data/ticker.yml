- "Home Office's new \"biometric check-in\" kiosk at a reception centre is denounced by local campaigners as \"Orwellian surveillance,\" kiosk confirmed by staff to only take a photo for the laminated meal card, same system used by the leisure centre next door for swimming passes"
- "Council's new \"dispersal strategy\" for housing asylum seekers is attacked for concentrating arrivals in \"one street,\" street in question confirmed to contain four semi-detached houses and a disused chapel, total capacity nine people"
- "Albion Policy Foundation report warns post-Brexit Britain is still being \"shaped by Brussels diktat\" over the shape of wine bottles on supermarket shelves, bottles confirmed to be made by a glassworks in Barnsley to a mould unchanged since 1987, three years before the UK joined the EU's predecessor bloc, findings described as \"stark\""
- "Market town's cobbled high street resurfacing is blamed by a shopkeepers' group on \"EU health and safety rules,\" council confirms the resurfacing is funded entirely by its own highways budget and was scheduled two years before Brexit took effect, Brussels having had no say over British pavements since 2020"
- "NHS trust's new \"digital front door\" triage app resolves a caller's chest pain query by directing them to a web page that is, itself, a scanned PDF of the old phone-triage flowchart"
- "Hospital's \"wellbeing wall\" mural, commissioned for £18,000 to \"boost staff morale,\" is unveiled in a corridor permanently blocked by a trolley bay, no shift has reported seeing it without at least one trolley parked in front"
- "Margaret Fenn's parish council votes to install a \"community noticeboard\" app, physical noticeboard removed from the village hall wall the same week, app downloaded four times, three of those by councillors testing it, Fenn says she has \"nothing against noticeboards\""
- "County council's \"devolution deal\" consultation receives 40,000 leaflets at a cost of £22,000, consultation itself closes after 11 days with 94 responses, 31 of which are from council staff"
- "BBC regional news segment on \"the vanishing British pub\" is filmed inside a pub that reopened under new management last spring and has had a six-week wait for a table ever since, landlord not asked to comment on camera"
- "Radio 4 phone-in on \"Britain's lost sense of community\" takes eleven calls, nine of which are from the same retired teacher in Harrogate who has called the same show four times this year"
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-made solar-powered garden lantern sold at his local hardware shop \"could be mapping the layout of British driveways,\" lantern confirmed by the manufacturer to contain a single light sensor and no transmitter of any kind"
- "District council quietly ends a 30-year-old twinning arrangement with a Chinese city over \"strategic concerns,\" arrangement confirmed to have consisted of one exchange visit in 1994 and a dormant noticeboard in the town hall foyer"
- "Gavin Bacon claims a supermarket's \"two for £5\" meal deal price rise to £5.50 is proof Britain is being \"managed into poverty,\" supermarket confirms the deal has risen by 50p twice in nine years, tracking below general food inflation both times"
- "Energy comparison website's \"switch and save\" banner promises savings of \"up to £400,\" smallest print on the same page confirms the average saving achieved by users last year was £11"
- "Gerald writes to his MP after his street WhatsApp group's \"crime watch\" map logs eleven incidents in a month, log review finds all eleven are the same fox knocking over the same wheelie bin, Gerald maintains the pattern is \"no coincidence\""
- "University \"inclusive language\" review spends four months retitling a first-year module from \"Freshman Writing Skills\" to \"Foundational Writing Skills,\" module content, reading list and tutor unchanged throughout"
