- "Gavin Bacon claims the new \"asylum seeker allowance\" includes a free bus pass \"to anywhere in Europe,\" transport authority confirms the pass is a standard concessionary ticket valid only within the county"
- "Home Office's new \"welcome pack\" for asylum seekers criticised by a local paper as \"lavish,\" pack contents confirmed as a phone charger, a laminated map, and a leaflet about bin days"
- "A Kent pub regular blames the dartboard's \"declining standards\" on the new \"continental lager\" tap, brewery confirms the lager is brewed in Burton upon Trent"
- "Cultural Policy Foundation report finds British handshakes have grown \"measurably limper\" since a French exchange student started working Saturdays at the local garden centre, findings described as \"stark\""
- "Hospital trust's new bulk-procured \"patient dignity\" curtains turn out one size too short for every bed on the ward, trust says replacements are \"under review\""
- "NHS 111's online symptom checker directs every entry, including a sprained ankle, to \"call 999 immediately,\" NHS Digital says the checker is \"erring on the side of caution\""
- "Margaret Fenn's parish council spends the entire annual flower-bed budget on a single commemorative bench nobody requested, Fenn says she has \"nothing against flowers\""
- "Borough council's new \"resident engagement app\" logs eleven complaints and seventy-three bug reports about the app itself in its first week"
- "BBC's new Saturday night talent show \"The Great British Think-In\" cancelled after one series when it emerges the panel of \"ordinary voters\" were all BBC employees' relatives"
- "BBC Breakfast's new \"balanced debate\" segment on a planning dispute invites one councillor and the councillor's husband as the \"independent second voice\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-made CCTV camera above a neighbour's chip shop \"could be monitoring the Channel,\" shop owner confirms the camera has never worked and faces the fryer"
- "Council freezes a twinned-city partnership with a Chinese city over \"due diligence concerns,\" the partnership's sole joint activity to date was a mural neither side has yet painted"
- "Supermarket's new \"price promise\" loyalty scheme offers points redeemable only against a single own-brand product discontinued the week of launch"
- "Chancellor's \"Buy British\" campaign posters are printed by an overseas firm, department says the contract \"represents best value for the taxpayer\""
- "Police force's new \"visible policing\" initiative consists of a single officer rotated between six town centres on a laminated schedule pinned inside the station window"
- "Amateur dramatic society renames its production of \"Snow White\" to \"Snow Person\" after zero complaints, script, songs and dwarfs unchanged, chair says the move was \"precautionary\""
