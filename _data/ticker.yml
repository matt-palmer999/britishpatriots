- "Gerald writes to his MP after noticing \"a fleet of unmarked grey minibuses\" dropping passengers outside the leisure centre every Tuesday evening, centre manager confirms they are the junior swimming club's car-share run for its weekly training session"
- "A disused petrol station being cleared and resurfaced sparks rumours on a community forum of \"a secret reception centre,\" council confirms the site is being prepped for a car valeting franchise due to open in the spring"
- "A fishmonger's switch to kilogram-only fish trays is denounced online as \"Brussels fishmongering rules sneaking back in,\" fishmonger says the trays are simply what his new supplier delivers, the EU having had no jurisdiction over how British fishmongers weigh fish for six years"
- "A village hall's noticeboard, repainted in a slightly different shade of blue, is denounced by a pensioner as \"the EU flag colour creeping back in by stealth,\" hall committee says the paint was simply left over from redecorating the toilets, Brussels having had no say over British noticeboard paint since 2020"
- "A hospital's new \"Compassionate Discharge Pathway\" turns out to be the existing discharge form with a smiley-face sticker added in the corner, trust calls it \"a meaningful step toward person-centred care\""
- "A GP surgery's \"Digital First Promise\" is found to require patients complete an eight-question online form before being told to simply phone the surgery anyway, practice calls it \"a streamlined triage experience\""
- "Margaret Fenn's parish council spends £1,870 on a \"Verge Mowing Frequency Review\" that concludes the verge should continue being mowed at its current frequency, Fenn insists the review was \"nothing against anyone, simply thorough\""
- "A borough council's £60,000 \"Town Centre Vibrancy Strategy\" recommends, after nine months of consultation, hanging a single banner reading \"Welcome\" across the high street, council leader calls it \"a landmark moment for the town's identity\""
- "A BBC consumer affairs programme's \"major exposé\" into car park ticket machines is confirmed to be a reporter standing in one car park for twenty minutes, broadcaster calls it \"a rigorous piece of investigative journalism\""
- "A BBC regional weather graphic's new font is denounced online as \"erasing traditional British weather,\" broadcaster confirms the only change is a font swap \"for improved legibility on mobile devices\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a town's new Chinese-made litter bins \"could be logging the rubbish habits of every British household,\" council confirms the bins are foot-pedal operated with no electronic components whatsoever"
- "Albion Policy Foundation report warns that a leisure centre's Chinese-made swimming pool clock \"represents a stark vulnerability in national infrastructure,\" centre manager confirms the clock is battery-powered and used solely to time lengths"
- "A budget airline's \"Low Fare Promise\" is found to apply only to its 6am flight on the second Tuesday of each month, airline calls it \"a clear demonstration of our value commitment\""
- "A supermarket's \"Price Lock Guarantee\" is found to apply to a single loaf of white bread, unchanged since the offer launched, chain calls it \"proof of our ongoing commitment to affordability\""
- "A police force's \"digital crime crackdown\" is confirmed to consist of one officer posting a crime-prevention tip on social media once a month, force calls it \"a modern and proactive approach to community safety\""
- "Gavin Bacon claims a train operator's station announcement saying \"Happy Holidays\" \"proves Christmas has been cancelled on the railways,\" operator confirms the announcement has alternated with \"Merry Christmas\" every other week since 2015 purely to vary the recording"
