- "Town's new \"welcome pack\" for asylum seekers turns out to be a single photocopied map and a bus timetable from 2019, council says it \"orientates arrivals effectively\""
- "Gavin Bacon claims a seaside town's rise in seagull complaints is \"symptomatic of migration pressure on local services,\" pest control confirms the gulls have nested on the pier for eleven years, well before any hotel opened"
- "Baker's new smaller loaf tins are denounced online as \"Brussels shrinking the British loaf,\" baker says he bought them secondhand from a retiring colleague in Preston to fit his new oven"
- "Hardware shop's new metric-only tape measures are called \"a stealth EU takeover of the inch,\" shop owner says the supplier in Sheffield discontinued imperial markings for cost reasons, with no EU rule in force in Britain for six years"
- "Dental practice's new \"rapid access\" scheme offers one appointment slot a month, booked within four minutes of the online form going live, practice says the demand shows \"the scheme is working as intended\""
- "Hospital trust unveils renamed \"Wellbeing Pathway\" for its waiting list, average wait unchanged at fourteen months, trust says the rename \"reflects a more compassionate framing\""
- "Margaret Fenn's parish council approves a \"heritage trail\" consisting of four new signposts pointing to features that no longer exist, Fenn says the trail \"celebrates what the village once had\""
- "Borough council's \"participatory budgeting\" exercise allocates £400 to residents' votes against a total council budget of £38 million, council calls the exercise \"a genuine shift of power\""
- "BBC regional documentary on \"the resilience of market towns\" is filmed entirely inside the one coffee shop that opened the same week, producer says the shop \"represents the wider recovery\""
- "BBC consumer programme investigating \"hidden fees\" discovers its own TV licence renewal page charges a £3 card surcharge, broadcaster says the fee is \"under separate review\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns a seaside town's new Chinese-made deckchairs \"could be relaying tidal data to Beijing,\" manufacturer confirms the deckchairs are canvas and wood with no electronic components"
- "Albion Policy Foundation warns a shipment of Chinese-made solar garden lights \"may pose a strategic surveillance risk,\" trading standards inspection finds the lights do not function after dark"
- "Supermarket's \"everyday low prices\" campaign coincides with the removal of its loyalty card discount on the same twelve items, shopper savings unchanged, supermarket calls the timing \"unrelated\""
- "Cultural Policy Foundation report finds commuters now spend \"22% longer\" at the ticket machine since staffed ticket windows were closed at a station, findings described as \"stark\""
- "Police force's new \"anti-social behaviour hotline\" is staffed for two hours a week and directs callers to a voicemail that is permanently full, force says the line \"provides an important channel for residents\""
- "Cricket club renames its \"Nets\" practice session the \"Skills Zone,\" balls, bats, and the actual nets left completely unchanged, club secretary says the change \"modernises our offering\""
