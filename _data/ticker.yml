- "Gerald writes to his MP after a \"mystery convoy\" of eight removal lorries parks near his street for two days, letting agent confirms it is one family's house move spread across two days owing to a narrow driveway"
- "A seaside town's new \"Welcome Point\" information kiosk is denounced in a leaflet as \"a processing centre in disguise,\" tourism board confirms it dispenses only tide times and a list of local ice cream flavours"
- "A brewery's switch to lighter beer bottles is blamed on \"Brussels bottle harmonisation,\" brewery says the change was made purely to cut shipping costs, the EU having had no authority over British bottle weights since 2020"
- "A market trader's leftover \"EU-style\" fruit stickers are denounced as proof Britain is \"still shackled to Brussels,\" trader says the stickers are simply old wholesaler stock, Brussels having set no rules for British market stalls in six years"
- "A hospital's new \"Dignity in Waiting\" initiative turns out to be a water cooler installed in the A&E corridor, trust calls it \"a transformative step in the patient experience\""
- "A GP surgery's \"Same-Day Access Promise\" is found to guarantee only a same-day phone call confirming no appointments are available, surgery says the promise \"sets clear expectations from the outset\""
- "A town council's £38,000 \"Future High Street Vision\" document recommends, after eleven months of study, repainting the existing bollards, council leader calls it \"a bold blueprint for renewal\""
- "A BBC breakfast programme's \"major new investigation\" into supermarket trolley wheels is confirmed to be a vox pop filmed in one car park, broadcaster calls it \"a vital piece of consumer journalism\""
- "A BBC children's show's new title sequence is denounced online as \"rewriting British childhood,\" production confirms the only change is a new logo font, chosen \"to improve readability on smaller screens\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a seaside pier's Chinese-made CCTV cameras \"could be relaying footage straight back to Beijing,\" operator confirms the cameras are not connected to any network and record onto a local hard drive wiped weekly"
- "A high street chain's \"Value Tracker Promise\" is found to compare today's prices only against its own prices from three years ago, chain calls it \"a clear demonstration of long-term value\""
- "A petrol station's \"Fuel Price Promise\" sign is found to apply to a single pump that has been out of order since August, forecourt says the promise \"remains fully in effect\""
- "A police force's \"community reassurance initiative\" is confirmed to be a single laminated poster of an officer's face stuck in a shop window, force calls it \"a proven deterrent\""
- "Margaret Fenn's parish council spends £2,100 on a \"Hedge Height Review\" that concludes the hedge may remain at its current height, Fenn insists the review was \"nothing against anyone, purely procedural\""
- "Gavin Bacon claims a coffee chain's seasonal cup design \"proves Christmas has been cancelled,\" chain confirms the cup still reads \"Merry Christmas\" in the same spot it has every year since 2019"
- "A primary school's \"Mindful Playtime\" sign is denounced as \"banning British games,\" headteacher confirms it only asks children to take turns on the one working swing"
