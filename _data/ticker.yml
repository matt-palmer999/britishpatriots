- "Home Office's new \"fast-track\" biometric scanner at a processing centre rejects every fingerprint on first attempt, staff told to \"just press it again, it usually goes through on the third go\""
- "Gerald writes to his MP after counting \"at least four\" men loitering outside the new asylum accommodation, council confirms all four are contractors fitting a fire door the building was cited for lacking"
- "Gavin Bacon tells a Reform UK rally that \"Brussels bureaucrats\" are behind delays to a Lincolnshire bypass, Highways England confirms the holdup is a protected newt population and a missing invoice"
- "Albion Policy Foundation report finds British queuing etiquette has grown \"measurably laxer\" since a self-service till was installed at a service station also used by continental lorry drivers, findings described as \"stark\""
- "NHS trust's new \"patient voice\" feedback kiosk only accepts five-star ratings, lower scores returned with the message \"please try again\""
- "GP surgery's new online booking system offers appointments \"within 48 hours,\" first available slot confirmed for three Tuesdays from now, receptionist says the 48 hours \"refers to how long the booking takes to load\""
- "Margaret Fenn's parish council votes to rename the village duck pond a \"biodiversity asset\" ahead of a grant application, pond unchanged, ducks un-consulted, Fenn says she has \"nothing against ducks\""
- "Borough council's new \"net zero fleet\" consists of one electric van shared across six departments, bookings currently full until February"
- "BBC's new primetime debate show \"Common Ground\" is retitled after its first episode when the panel fails to find any"
- "BBC local radio's new \"community voices\" slot features the same three contributors on rotation, station says the pool \"will widen once more people call in\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a new Chinese-owned app on his grandson's tablet \"could be mapping troop movements,\" app confirmed to be a children's colouring game with no location permissions"
- "Council pulls a sister-city agreement with a Chinese city over \"due diligence concerns,\" the agreement's only prior activity was a biennial exchange of commemorative tea sets"
- "Chancellor's new \"cost of living dashboard\" shows prices falling across twelve categories, dashboard's data last updated the week it launched"
- "High street bank's \"free\" current account introduces a monthly \"account maintenance\" fee, bank says the account \"remains free of charge for customers who maintain a zero balance\""
- "Police force's new \"community reassurance\" patrol car is fitted with a camera that broadcasts live to a council website nobody has viewed in four months"
- "Council renames its \"Christmas Market\" the \"Winter Market\" after a single stallholder complaint, mulled wine and nativity float unchanged, complaint later found to be about parking"
