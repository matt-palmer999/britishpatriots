- "Seaside town's sister-city application with a Chinese port is paused after a councillor raises \"security concerns,\" concerns traced to a WhatsApp forward with no identifiable source"
- "Supermarket's \"value range\" relaunch keeps the price the same but shrinks the tin by two centimetres, spokesman calls it \"portion modernisation\""
- "Energy regulator's \"bill clarity\" overhaul simplifies three tariff names into one new tariff name, average bill unchanged beneath the rebrand"
- "Police force launches a \"knife surrender bin\" scheme, first week's haul found to be two butter knives and a garden trowel, all handed in by the same pensioner"
- "University's \"decolonised\" reading list swaps one 19th-century novel for another 19th-century novel by the same author, students not informed of the change"
