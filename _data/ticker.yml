- "Gerald writes to his MP after spotting \"a coordinated convoy of coaches\" dropping people at the leisure centre twice a week, leisure centre confirms it is the over-60s aqua aerobics class arriving for its usual Tuesday and Thursday session"
- "A market town's new \"Welcome Point\" information kiosk is denounced on social media as \"the first stage of a two-tier resettlement hub,\" town council confirms the kiosk sells bus timetables and has been there, under a different sign, since 2014"
- "Gavin Bacon accuses a supermarket of \"caving to Brussels\" after it starts selling wine in 75cl bottles, supermarket confirms the bottle size has been standard across the entire British wine trade since long before Brexit and has no connection to the EU"
- "A village's newly painted blue-and-gold bus shelter is reported to the parish council as \"a creeping EU flag on the high street,\" contractor confirms the colours were the only paint left over from the primary school railings job"
- "A hospital trust's \"Dignity in Care Pledge\" turns out to add one extra word, \"please,\" to the existing gown-changing instructions, trust calls it \"a meaningful cultural shift in patient dignity\""
- "A GP surgery's new online booking system goes live with a single appointment slot available, for a Tuesday six months ago, surgery says the system is \"performing exactly as specified\""
- "Margaret Fenn's parish council spends £1,180 on a \"Verge Consistency Review\" that concludes the verge should continue to be mown at the height it is currently mown, Fenn says the review was \"nothing against anyone, simply thoroughness\""
- "A borough council's £60,000 \"High Street Vibrancy Strategy\" results, after eighteen months, in the repainting of one existing bollard, council leader calls it \"a bold first step in a long-term vision\""
- "A BBC radio phone-in's \"listener power hour\" is revealed to feature the same three pre-booked callers every week, producer calls it \"an authentic cross-section of listener opinion\""
- "A BBC current affairs programme apologises after a caption misspells a minister's name, broadcaster launches a \"full editorial review,\" review concludes with the caption corrected the same afternoon"
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-made kettle supplied to a village hall committee room \"could be relaying sensitive biscuit-rota data to Beijing,\" hall caretaker confirms the kettle has no wiring beyond a plug and a switch"
- "Cultural Policy Foundation report finds a seaside pier's Chinese-manufactured arcade claw machines represent \"a stark gap in the UK's amusement sovereignty,\" pier operator says the machines have dispensed the same unclaimed teddy bear since 2019"
- "A supermarket's \"Essentials Price Lock\" freezes the price of its own-brand beans while reducing the tin from 420g to 380g, chain calls the change \"portion modernisation\""
- "A broadband provider's \"Loyalty Thank You\" offer gives existing customers a faster package at the exact price new customers already pay for it, retention team calls it \"a genuine gesture of appreciation\""
- "A police force's new \"Neighbourhood Visibility Pledge\" turns out to be a parked, empty patrol car left in a supermarket car park for four hours a week, force calls it \"a strong deterrent presence\""
- "A bowls club renames its \"Ladies' Captain\" and \"Men's Captain\" roles \"Captain A\" and \"Captain B\" after a fairness review, members report nobody can now tell which captain is responsible for which end of the green"
