- "Gerald writes to his MP about a \"mysterious fleet\" of white vans parked outside the church hall every Wednesday night, vicar confirms it is the badminton club's equipment van and has used the same spot since 2011"
- "A seaside town's new multilingual welcome sign is denounced as \"surrendering the high street before a single word is spoken,\" town clerk confirms the sign simply repeats \"Please Mind the Step\" in the three languages most spoken by its own existing residents"
- "Gavin Bacon demands Britain \"take back control\" of kettle wattage after a manufacturer lowers it to meet a voluntary industry standard, manufacturer confirms the standard was written by a British trade body in 2009 and the EU has no say in it"
- "A roundabout's new circular flowerbed is reported to a local Facebook group as \"an unmistakable EU starred circle laid out in begonias,\" council confirms the bed is circular because the roundabout is circular"
- "A hospital's new \"Patient Voice Initiative\" turns out to be a suggestions box bolted to a wall that has not been opened in fourteen months, trust spokesperson calls it \"a vital channel for feedback\""
- "An NHS trust unveils a \"Corridor Care Reduction Plan\" that consists entirely of moving the corridor beds eleven feet into a wider corridor, trust calls it \"a significant improvement in patient environment\""
- "Margaret Fenn's parish council approves a £940 \"Hedge Sightline Audit\" that concludes the hedge should be trimmed to the height it was already being trimmed to, Fenn says the audit was \"nothing against anyone, simply due diligence\""
- "A district council's £35,000 \"Market Square Renewal Vision\" delivers, after a two-year consultation, one relocated litter bin, council leader calls it \"a genuinely transformative milestone\""
- "A BBC regional news bulletin's \"Your Say\" segment is revealed to run the same viewer email every Friday for the past eleven weeks, editor calls it \"a representative snapshot of audience feeling\""
- "A BBC documentary pulls a stock photo after a complaint it \"subtly favours one viewpoint,\" broadcaster's internal review finds the photo was of a motorway junction with no people in it"
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-manufactured bird table in the village allotments \"may be feeding more than birds back to Beijing,\" allotment society confirms the table has no electronic parts and was assembled from a flat-pack kit"
- "Albion Policy Foundation report finds a garden centre's Chinese-made wind chimes represent \"a stark erosion of acoustic sovereignty,\" garden centre says the chimes have simply been making the same two notes since they were unboxed in March"
- "A supermarket's \"Family Value Promise\" holds the price of its own-brand orange juice while reducing the carton from 1 litre to 850ml, chain calls the change \"size optimisation for modern households\""
- "An energy supplier's \"Winter Warmth Guarantee\" turns out to guarantee only that the standing charge will not rise faster than it already planned to, supplier calls it \"a reassuring commitment to customers\""
- "A police force's new \"Rapid Response Pledge\" is revealed to apply only between the hours of 10am and 2pm on weekdays, force calls it \"a focused and efficient use of resources\""
- "A village cricket club renames its \"Chairman\" role \"Chairperson of Cricketing Affairs\" after an inclusivity review, members report the new title no longer fits on the honours board and has been handwritten in since July"
