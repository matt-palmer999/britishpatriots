- "Gerald writes to his MP after noticing a \"sudden influx\" of unfamiliar names on the allotment waiting list, allotment society confirms the list has simply been alphabetised for the first time in a decade and contains the same families as before, now in a different order"
- "A new estate's standard-issue welcome pack is denounced online as \"two-tier integration propaganda,\" developer confirms it is the same bin-collection leaflet handed to every resident since the estate opened, with one extra page about recycling days"
- "Gavin Bacon accuses a biscuit manufacturer of \"surrendering to Brussels measurements\" after a new packet lists its weight in grams, manufacturer confirms British packaging has been legally required to show metric weight since 1995, regardless of Brexit, and the EU has no say in the matter"
- "A seaside town's Christmas display, a ring of twelve gold baubles strung around an inflatable snowman, is reported to the council as \"flying the EU flag in all but name,\" council confirms the baubles came pre-strung from the same supplier the town has used every December since 2015"
- "A hospital trust's new \"Compassionate Discharge Pledge\" is found to consist of a laminated thank-you card left on the pillow, trust calls it \"a landmark step in patient-centred care\""
- "A dental practice's \"Smile Access Guarantee\" turns out to guarantee only a returned phone call confirming there are no appointments available, practice calls it \"a transparent and timely response service\""
- "Margaret Fenn's parish council approves a £1,560 \"Street Furniture Sightline Review\" that concludes the existing bus stop sign should remain exactly where it already is, Fenn says the review was \"nothing against anyone, simply prudent governance\""
- "A town council's £28,000 \"Heritage Trail Enhancement\" delivers, after a year of planning, a single QR code sticker on an existing plaque, council leader calls it \"a landmark moment in the town's story\""
- "A BBC consumer affairs programme's \"Big Viewer Debate\" phone poll is revealed to have received four calls in total, three from the same household, presenter calls the result \"a clear and decisive verdict from the public\""
- "A BBC local news \"Your Photos\" slot is found to have used the same viewer-submitted sunset photograph every Friday for the past two months, producer calls it \"an authentic reflection of viewer creativity\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-made solar garden gnome in a quiet cul-de-sac \"may be charting resident movements after dark,\" neighbour confirms the gnome's only function is a single LED in its hat that switches on at dusk"
- "Albion Policy Foundation report finds a village fete's Chinese-manufactured bunting represents \"a stark thread in the fabric of national resilience,\" fete committee says the bunting has simply been reused from the same box every summer since 2016"
- "A supermarket's \"Household Hero Promise\" holds the price of its own-brand teabags while cutting the box from 160 bags to 136, chain calls the change \"portion recalibration for modern kitchens\""
- "A budget airline's \"Fair Fare Promise\" turns out to apply to a single seat on each flight, already sold before the promise launched, airline calls it \"a genuine demonstration of value for passengers\""
- "A police force's new \"Digital Trust Dashboard,\" advertised as showing real-time crime statistics, is found to be a single screenshot updated by hand once a month, force calls it \"a transparent and modern tool for the public\""
- "A rowing club renames its \"Coxswain\" role \"Steering Coordinator\" after an inclusivity review, members report the new title doesn't fit on the kit order form and has been abbreviated to \"S. Co.,\" now indistinguishable on the kit from the logo of the club's main sponsor, S&Co Hardware"
