- "Gavin Bacon claims a new asylum reception centre has a \"waiting list\" for rooms, centre confirms the list is the laundry rota and has four names on it"
- "A seaside guesthouse owner tells a local paper his business has been \"destroyed\" by nearby asylum housing, accounts show turnover unchanged for three years and up on last August"
- "County council blames a pothole repair delay on \"EU-derived highways rules,\" highways department confirms the rules were repealed in 2021 and the delay is a staffing gap"
- "Cultural Policy Foundation warns a town's new recycling sorting bins \"reflect a continental mindset,\" bins found to be made in Doncaster and funded by a UK government grant, findings described as \"stark\""
- "NHS trust renames its A&E waiting area the \"assessment lounge,\" average wait unchanged, lounge still has no chairs"
- "GP surgery's new AI phone system tells a caller reporting chest pains to \"try calling back during off-peak hours,\" surgery says the system is \"front-loading demand management\""
- "Margaret Fenn's parish council votes to install a \"heritage noticeboard,\" board found to be the old noticeboard with a new coat of varnish, Fenn says she has \"nothing against the original noticeboard\""
- "Town council's new \"resident engagement strategy\" consists of a suggestions box bolted to a wall that has been bricked up since the leisure centre closed in 2019"
- "BBC daytime show runs a debate on \"is Britain losing its sense of humour,\" panel spends eleven minutes agreeing with each other before anyone laughs"
- "BBC local radio's new \"community callback\" slot broadcasts a listener's complaint that the show's phone line is \"always engaged,\" show unable to get the listener on air to discuss it"
- "Col. (Ret'd) Brian Fortescue-Hatch warns a Chinese-made smart bin on the high street \"could be reporting the town's waste habits to Beijing,\" council confirms the bin has no sensors and is emptied manually on Tuesdays"
- "Market town cancels a twinning ceremony with a Chinese city over \"undue influence,\" ceremony's only prior achievement found to be a joint flowerbed neither town has watered since 2017"
- "Chancellor announces a \"cost of living taskforce\" to examine supermarket pricing, taskforce's first meeting delayed because the room booked for it was double-booked with a yoga class"
- "Energy supplier's new \"fairness promise\" freezes the unit rate while doubling the standing charge, spokesman calls the change \"rebalancing, not a rise\""
- "Police force's new \"community reassurance van\" visits a street once a month to hand out leaflets confirming \"crime remains low,\" leaflet run paused after the van itself is broken into on the same street"
- "Office introduces gender-neutral toilet signage, signage swapped overnight for new signage after someone points out the icon used was for a different office entirely"
