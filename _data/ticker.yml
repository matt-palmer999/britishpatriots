- "Gavin Bacon demands \"urgent clarity\" on the number of asylum seekers housed in a seaside town, council confirms the figure he's been quoting all week is the number of seagulls counted in last year's bird survey"
- "Gerald writes to his MP after a hotel near him is \"earmarked\" for asylum housing, Home Office confirms the hotel was never earmarked for anything and has been fully booked with wedding parties since March"
- "Local butcher blames a new rule on sausage packaging on \"Brussels red tape,\" Trading Standards confirms the rule is a British labelling requirement that predates Brexit by six years"
- "Albion Policy Foundation warns a town's new bike lane \"imports a continental mindset,\" lane confirmed to have been designed and funded entirely by the county council's own highways department, findings described as \"stark\""
- "NHS trust rebrands its hospital car park the \"arrival experience zone,\" barrier still broken, charges unchanged, sign installed nine days late"
- "Ambulance trust's new AI-assisted dispatch system advises a caller with a suspected broken leg to \"elevate the limb and monitor for 48 hours,\" trust says the system is \"still calibrating for urgency\""
- "Margaret Fenn's parish council spends £2,400 on a \"village identity workshop\" to choose a new slogan for the village sign, workshop concludes the existing slogan should stay, sign not due for replacement for another decade"
- "District council's new \"digital first\" bin collection app requires residents to print a QR code at home to access it, library's only printer out of order since July"
- "BBC panel show devotes a segment to \"whether politeness is dying,\" panellist apologises for taking up too much time making the point, segment runs four minutes over"
- "BBC's regional weather forecast issues a \"yellow warning for drizzle,\" warning upgraded to amber the same afternoon for the same drizzle, unchanged"
- "Col. (Ret'd) Brian Fortescue-Hatch warns a Chinese-made kettle sold in a seaside hardware shop \"could be relaying the nation's teatime habits to Beijing,\" shop confirms the kettle has no wireless capability and struggles to boil in under four minutes"
- "Seaside town shelves a sister-city agreement with a Chinese port over \"strategic exposure,\" agreement's only output in nine years found to be a shared lamppost banner for a defunct trade fair"
- "Chancellor unveils a \"household energy shield\" capping bills for six weeks, supplier raises the standing charge the same afternoon, regulator calls the timing \"coincidental\""
- "Supermarket's new \"budget range\" own-brand biscuits priced the same as the range it replaced, packet now one biscuit lighter, spokesman calls it \"portion modernisation\""
- "Police force's new \"virtual patrol\" scheme sends residents a weekly photo of an empty high street captioned \"all quiet,\" scheme paused after the same photo is sent twice during an active burglary two doors down"
- "University renames \"Freshers' Week\" the \"Welcome Period\" after a fairness review, wristbands, events and pub crawl route left entirely unchanged, students' union says the change \"centres inclusion\""
