- "Gerald writes to his MP demanding a hotel housing asylum seekers fly a \"proper\" flag, hotel confirms it has flown the same Union Jack since 2014"
- "Gavin Bacon claims a Channel crossing \"surge\" is being hidden by the Home Office, Home Office figures he cites in the same breath show crossings down 12% on last year"
- "Builders' merchant blames a shortage of a specific sand grade on \"EU export quotas,\" supplier confirms it sources only from a Cornish quarry and the shortage is a broken conveyor belt"
- "Albion Policy Foundation warns new continental-style café awnings are \"softening the high street for Brussels,\" awnings found to have been ordered from a Sheffield manufacturer in 2019, findings described as \"stark\""
- "Hospital trust rebrands its discharge lounge the \"departure suite,\" patients still waiting on trolleys, suite's only food option remains a vending machine with two working buttons"
- "NHS 111 online triage tool advises a user with a suspected broken wrist to \"elevate the limb and monitor for 48 hours,\" tool later found to have been trained largely on leaflets about sprained ankles"
- "Borough council unveils a \"vision document\" for the high street consisting of a single photograph of the high street with a sunset filter applied"
- "Margaret Fenn's parish council votes to rename the village duck pond a \"biodiversity asset,\" pond unchanged, ducks reportedly \"unbothered,\" Fenn says she has \"nothing against the old name\""
- "BBC flagship debate show hosts a panel on \"cancel culture,\" panel cancels a guest's appearance over a seven-year-old tweet before the show airs"
- "BBC local news runs a two-minute segment praising a town's \"community spirit,\" segment filmed entirely inside the BBC's own regional newsroom canteen"
