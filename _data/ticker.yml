- "Home Office contractor's \"welcome pack\" for a new reception centre includes a laminated map of the nearest bus stop, campaigners call the pack \"a blueprint for migration routes,\" bus stop confirmed to be served by the number 12 to the retail park"
- "Council's asylum housing \"saturation audit\" flags a market town at \"crisis capacity,\" audit's own figures show the town has taken in six families against a target of eight, two spare places unfilled for a month"
- "Albion Policy Foundation report warns British kettle design has been \"quietly harmonised\" to EU standards by a manufacturer that has sold the same model since 2011, company confirms no design change since launch, nine years before Brexit, findings described as \"stark\""
- "Gavin Bacon says a motorway services' new \"metric only\" fuel pump display is \"Brussels creeping back in,\" operator confirms pumps have displayed litres since they were installed in 2003, under UK law, with no EU involvement at any point"
- "NHS trust's new \"patient flow\" dashboard, built at a cost of £140,000, is found by staff to require a manual phone call to A&E to confirm whether any beds are actually free"
- "Hospital trust's \"green corridor\" initiative plants forty trees in tubs outside the main entrance, entrance confirmed by staff to be the hospital's main smoking area, trees already showing signs of nicotine damage"
- "Margaret Fenn's parish council spends £3,400 on a \"village identity\" rebrand, new logo confirmed to be the old logo with the font changed, Fenn says she has \"nothing against the old font, as such\""
- "Borough council's \"digital inclusion\" scheme to hand out tablets to pensioners is found to have distributed eleven devices against a budget for four hundred, remaining funds spent on a launch event for the eleven recipients"
- "BBC daytime documentary on \"Britain's disappearing corner shops\" is filmed in a corner shop that has operated under the same family for fifty years and has no plans to close, shop's till roll shown on camera as evidence of decline"
- "Radio 4 panel discussion titled \"Is Britain Losing Its Voice?\" runs for forty-five minutes without a single caller from outside the M25, producer says regional lines were \"fully open throughout\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-made smart kettle sold at his local department store \"could be listening to breakfast conversations,\" manufacturer confirms the kettle's only electronic component is a thermostat switch"
- "County council quietly shelves a \"friendship city\" proposal with a Chinese port town after a leaked memo warns of \"unacceptable risk,\" memo turns out to be a cost estimate for a civic dinner, risk assessment limited to catering allergens"
- "Gavin Bacon claims a high street chain's loyalty app price rise from free to 99p a year is evidence Britain is \"being taxed for simply shopping,\" chain confirms the 99p covers server costs and has not changed since the app launched three years ago"
- "Supermarket's \"value range\" relaunch adds a Union Jack sticker to forty products, prices on all forty unchanged, three products confirmed to have been reduced in size by 8 per cent the previous month"
- "Gerald writes to his MP after his neighbourhood app's \"suspicious activity\" alert logs nine reports in a fortnight, police review finds all nine describe the same delivery driver parking briefly outside the same house"
- "Local college's \"equity audit\" of its canteen menu recommends renaming \"fish and chips\" to \"battered fish, potato, chef's choice,\" dish, price and recipe left entirely unchanged"
