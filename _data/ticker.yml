- "Home Office unveils \"AI tone analysis\" software for asylum interview transcripts, flagging applicants as \"insufficiently distressed,\" pilot paused after the system also flags a Home Office duty manager's own voicemail greeting"
- "Gerald writes to his MP demanding to know why the new reception centre's hedges get trimmed twice as often as the war memorial's, MP's office forwards the query to the parks department"
- "Cornish cheesemaker adopts an EU-style Protected Designation sticker to clear a Belgian retailer's shelf audit, Gavin Bacon brands it \"Brussels fingerprints on a wheel of cheddar\""
- "Cultural Policy Foundation report finds the average British roundabout now takes \"0.4 seconds longer\" to navigate than before 2016, blames \"lingering continental signage habits,\" findings described as \"stark\""
- "NHS trust introduces mandatory 90-second \"wellness breathing pauses\" between consultations, waiting list unaffected, GPs report running later than before"
- "Hospital's new check-in kiosk asks patients to rate pain using an emoji slider, system logs a broken arm as \"mildly inconvenienced\" after the touchscreen sticks on the wrong face"
- "Margaret Fenn's parish council unveils a \"wildflower meadow\" in the village square, meadow turns out to be a patch of uncut grass with a laminated sign, Fenn says she has \"nothing against tidiness\""
- "Council replaces its manned car park booth with an app, pensioners' group reports a 40-minute queue forming around the one remaining attendant who can explain how the app works"
- "BBC regional bulletin trials \"impartiality subtitles\" that append a counter-fact to every on-air statement, format pulled after the weather forecast is disputed on screen as \"some may feel it will not rain\""
- "BBC commissions a documentary on \"lost pub culture\" filmed entirely in pubs that are still open, production confirms none of the featured pubs has actually closed"
- "Col. (Ret'd) Brian Fortescue-Hatch devotes a column to a Chinese-made running machine in the leisure centre, warning it could be \"mapping the nation's cardiovascular weak points,\" leisure centre confirms it only counts steps"
- "University confirms its Chinese-funded greenhouse research partnership is limited to tomato ripening schedules, opposition backbencher calls it \"a foothold in our salads\""
- "Chancellor launches the \"Great British Loyalty Stamp,\" a cardboard card offering a free own-brand teabag after 40 full-price purchases, scheme quietly discontinued after printing costs exceed the value of the tea"
- "Supermarket's new \"value tier\" own-brand range is quietly priced 2p above the range it replaced, spokesperson calls it \"a simplification of choice\""
- "Police force's new predictive policing software flags a Tuesday farmers' market as a \"recurring hotspot\" after mistaking stallholders opening their van doors for suspicious activity"
- "Village amateur dramatics society renames its \"Best Supporting Actor\" award \"Most Valuable Ensemble Contributor\" after a fairness review, award goes undecided for the third year running as nobody can define \"ensemble contribution\""
