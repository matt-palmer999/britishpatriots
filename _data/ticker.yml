- "Chancellor launches the \"Great British Discount,\" a voucher scheme offering 50p off own-brand bread redeemable only between 6am and 6:15am on Tuesdays"
- "Energy supplier's new \"smart tariff\" app offers its cheapest rate for one hour at 3am, customer services confirms the app does not support alarms"
- "Police force's new AI loitering-detection camera flags a bus-stop queue of pensioners as \"elevated risk behaviour\" on its first morning of operation"
