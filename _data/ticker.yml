- "Home Office confirms its new \"digital queue\" for asylum appointments is a single shared tablet passed between caseworkers, backlog described internally as \"technically mobile now\""
- "Gerald writes to his MP to complain that the council's new noticeboard uses a font he can't read without his glasses, MP's office confirms the noticeboard is otherwise blank"
- "Gavin Bacon demands Britain \"take back control\" of a roundabout's give-way markings, Highways England confirms the markings were repainted by a local contractor last Tuesday and never left British hands"
- "Albion Policy Foundation report finds British queueing etiquette has \"measurably softened\" since a French ferry operator introduced numbered boarding, findings described as \"stark\""
- "NHS trust's new \"patient experience\" survey is itself delayed by three weeks due to a printing backlog, trust apologises for the apology arriving late"
- "GP surgery's new online booking portal logs every cancelled appointment as \"successfully completed,\" practice manager says the figures \"look excellent\" this quarter"
- "Margaret Fenn's parish council votes to rename the village duck pond a \"biodiversity asset,\" pond unchanged, Fenn insists she has \"nothing against ducks\""
- "Council's new recycling app rejects a resident's bin photo for \"insufficient lighting,\" resident's bin collection is cancelled for the week, council calls it \"a data quality issue\""
- "BBC local news runs a segment on \"both sides\" of a village fun run, interviewing one runner who finished and one who did not start, broadcaster calls it \"balanced sports coverage\""
- "BBC orchestra's new \"accessible seating\" trial removes the front three rows of a concert hall entirely, venue confirms no wheelchair users have yet requested the space"
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-made kettle sold in a discount shop \"could be listening to the nation's teatime,\" manufacturer confirms the kettle has no microphone, only a whistle"
- "Local college's Mandarin exchange programme is suspended after a single classroom projector malfunctions, backbencher calls the fault \"no coincidence\""
- "Chancellor unveils a \"Great British Discount Week,\" prices rise by 3% the Monday before so the Thursday markdown returns them to where they started"
- "Energy supplier's new \"smart tariff\" charges extra for the privilege of being told which hours are cheapest, customers report the notification fee exceeds the savings"
- "Police force's new \"community reassurance\" patrol car is fitted with speakers playing birdsong, residents report it is louder than the traffic it was meant to soothe"
- "Office's new \"neutral decor\" policy removes all desk photographs for fairness, review board can't agree whether a desk calendar counts as personal, decision deferred to next quarter"
