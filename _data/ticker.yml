- "Gerald writes to his MP after counting \"eleven unmarked white vans\" circling his cul-de-sac in one afternoon, delivery firm confirms the vans belong to a single driver completing a round of eleven separate parcel drops"
- "A disused Scout hut earmarked for \"temporary community use\" sparks a 400-strong Facebook group warning of a secret asylum facility, district council confirms the building is being surveyed for dry rot before a badminton club takes up a five-year lease"
- "A garden centre's new metric plant-pot sizing is denounced as \"an EU conversion by the back door,\" manager says the pots were simply restocked from a new wholesaler, Brussels having had no jurisdiction over British plant pots since 2020"
- "A seafront café's switch to a slightly smaller teaspoon is branded \"Brussels cutlery creep\" by a regular, owner says the teaspoons are from a new catering supplier and nobody in Brussels has had any say over British teaspoons for six years"
- "A hospital trust's \"Patient Empowerment Pathway\" turns out to be the same referral letter with the word \"appointment\" replaced by \"empowerment session,\" trust says the change \"puts patients at the heart of their own care journey\""
- "A GP practice's new \"Wellness Concierge\" role is confirmed to be the existing receptionist with an extra laminated name badge, practice manager calls it \"a holistic front-of-house transformation\""
- "A BBC regional bulletin's \"exclusive investigation\" into a closed public toilet is confirmed to be one email to the council sent in April, broadcaster describes the item as \"an ongoing story we continue to monitor closely\""
- "A BBC daytime quiz show's \"fresh new look\" is confirmed to be the same set with the podiums repainted from blue to teal, viewers call it \"a quiet ideological statement,\" producer says the colour \"better reflects our brand values\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a town's new Chinese-made parking meters \"could be mapping the movements of every British motorist,\" council confirms the meters only accept contactless payment and store no location data whatsoever"
- "Albion Policy Foundation report warns that a primary school's Chinese-made interactive whiteboards \"represent a stark vulnerability in the nation's classrooms,\" headteacher confirms the boards are not connected to the internet and are used mainly for the times tables"
- "A supermarket's \"Everyday Rewards Promise\" is found to apply solely to a single two-for-one offer on tinned peas, chain says the promise \"demonstrates our unwavering commitment to value\""
- "An energy provider's \"Simple Price Plan\" is found to include a £4.20 monthly \"billing administration fee\" absent from the headline rate, provider calls it \"a clearer way of itemising your statement\""
- "A police force's \"enhanced night-time economy patrol\" is confirmed to consist of one community support officer walking the same high street twice a week, force calls it \"a visible and reassuring presence\""
- "Margaret Fenn's parish council spends £1,650 on a \"Village Signage Audit\" that recommends leaving the existing welcome sign exactly as it is, Fenn says the audit was \"nothing against anyone, just due diligence\""
- "Gavin Bacon claims a supermarket's seasonal \"Winter Celebrations\" aisle sign \"proves two-tier Christmas has arrived,\" store confirms the sign has read \"Winter Celebrations\" every November since 2016 to cover several holidays stocked on the same aisle"
- "A village cricket club's \"Chairperson's Welcome\" sign is denounced online as \"erasing tradition,\" committee confirms the sign has simply been repainted after weather damage, with the same wording used since the role was renamed in 2014"
