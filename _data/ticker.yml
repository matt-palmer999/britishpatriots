- "Home Office's \"sponsor visa fast-track\" lane at the airport turns out to be the same lane repainted a slightly different shade of blue, average processing time unchanged to the second"
- "Gerald writes to his MP to report that the asylum hotel's bin day clashes with his own, MP's office confirms the two streets have shared a collection day since before the hotel existed"
- "Gavin Bacon hails a \"major Brexit win\" after a Lincolnshire sausage factory enlarges its \"Produced in Britain\" stamp by two millimetres, factory confirms no rule, British or otherwise, ever required the stamp's size to change"
- "Albion Policy Foundation report finds motorway service station queues have grown \"measurably more continental\" since a Belgian waffle stand opened at one services, findings described as \"stark,\" stand confirms it has sold eleven waffles"
- "NHS trust's new \"patient journey\" signage replaces every ward number with a calming colour name, ambulance crew reports a 20-minute delay locating \"Ward Serene\" during a cardiac arrest"
- "Dental surgery's new booking line plays a 12-minute hold message about the importance of flossing, practice manager says patient feedback on the message itself has been \"overwhelmingly negative\""
- "Margaret Fenn's parish council votes to install a \"community noticeboard\" that only councillors hold the code for, Fenn says she has \"nothing against transparency\""
- "Town council's new \"resident satisfaction\" dashboard shows 98% approval after the survey link is emailed only to councillors' relatives, council leader calls the figure \"robust\""
- "BBC flagship debate on \"Britain's trust in institutions\" is delayed forty minutes by a studio technical fault the BBC declines to explain, presenter opens the segment by promising viewers \"full transparency going forward\""
- "BBC local radio's \"community callers\" slot is revealed to be the same three retired teachers phoning in on rotation, station manager calls it \"a representative cross-section of the area\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-made school recorder handed out in music lessons \"could be transmitting playground chatter to Beijing,\" music teacher confirms the recorder has no battery and runs on breath"
- "Seaside council removes a part-Chinese-funded solar bus shelter after a motion calls it \"a strategic vulnerability,\" replacement shelter has no roof"
- "Chancellor announces a \"Great British Price Freeze\" on own-brand baked beans, tin size shrinks by 15 grams the same week, supermarket calls it \"portion modernisation\""
- "High street bank's new \"budgeting assistant\" app charges £2.99 a month to tell customers they are spending too much on subscriptions"
- "Police force's new \"visible policing\" initiative parks an empty patrol car outside the same bakery every morning, force confirms no officer has been assigned to sit in it"
- "Village cricket club renames its \"First XI\" the \"Primary Eleven\" after a committee member raises concerns about \"ranking language,\" the Second XI remains unrenamed as nobody on the committee had noticed it existed"
