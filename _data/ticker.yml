- "Gerald writes to his MP demanding to know why a disused Travelodge earmarked for asylum housing has \"no leisure facilities,\" hotel chain confirms the pool was drained for renovation in 2021, long before any housing plan existed"
- "Gavin Bacon claims a spike in parking complaints outside a reopened church hall is \"a direct consequence of uncontrolled migration,\" hall committee confirms the hall now hosts a weekly bingo night unrelated to any migrant service"
- "Pub's switch to smaller pint glasses for its tasting flights is branded \"Brussels coming for the British pint\" online, landlord says the glasses were a job lot bought from a closing restaurant in Leeds, with EU pint rules having no force in Britain since 2020"
- "Greengrocer's decision to sell bananas loose instead of in bags is called \"an EU plot to weigh down British wallets\" by a customer petition, greengrocer says the change was to cut down on plastic bag costs, noting Brussels has had no say over UK greengrocers for six years"
- "Hospital's new \"Patient Experience Suite\" turns out to be the old waiting room with two extra chairs and a vending machine, trust says the upgrade \"significantly enhances comfort\""
- "GP surgery's new online triage tool directs 94% of symptom entries straight to \"please call 111,\" surgery says the tool \"streamlines patient pathways\""
- "Margaret Fenn's parish council votes to rename the duck pond a \"Biodiversity Asset,\" ducks, pond, and surrounding railings left entirely unchanged, Fenn says the move \"nothing against anyone, simply reflects modern best practice\""
- "Borough council's new \"digital-first\" consultation on bin collections receives 11 responses, all from the same household's four email addresses, council says the result shows \"strong community engagement\""
- "BBC daytime quiz show criticised for \"woke bias\" after a question about the Magna Carta is followed immediately by an advert break, viewers complain the sequencing felt \"pointed,\" producer says it was \"scheduled months in advance\""
- "BBC's new regional news idents cost £280,000 to produce, viewers say they \"can't tell the difference\" from the previous idents, broadcaster says the refresh \"better reflects the region's identity\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns a town's new Chinese-made litter bins \"could be mapping bin collection routes for a foreign power,\" council confirms the bins have no electronics and are emptied by the same crew as before"
- "Albion Policy Foundation report warns a popular Chinese-made karaoke machine sold in UK pubs \"may pose a national security risk,\" retailer says the machine's only function is playing backing tracks from a USB stick"
- "Supermarket's \"price freeze\" pledge on bread excludes the three best-selling loaves, which rose in price the same week, supermarket calls the overlap \"coincidental\""
- "Cultural Policy Foundation report finds households are spending \"17% more time\" comparing energy tariffs since a price comparison site redesigned its homepage, findings described as \"stark\""
- "Police force's new \"visible policing\" initiative consists of one laminated poster of an officer's photo taped to a lamppost, residents say they \"haven't seen an actual officer in months,\" force says the initiative \"reassures the public\""
- "Leisure centre renames its \"Ladies' Swim\" session the \"Inclusive Aquatic Hour,\" times, pool, and attendance entirely unchanged, centre manager says the rebrand \"modernises our offering\""
