- "Gerald writes to his MP after noticing a stack of pallets outside the village hall, convinced they are \"processing crates for a new arrivals centre,\" hall caretaker confirms they are folding tables for Saturday's WI jumble sale"
- "A seaside town's multi-faith prayer room sign at the railway station is denounced online as \"evidence of planned religious replacement,\" station manager confirms the room has stood locked and unused since 2014 except for an annual visit from a touring choir"
- "Col. (Ret'd) Brian Fortescue-Hatch declares a greengrocer's metric-only weighing scales \"a Brussels relic strangling British shopkeepers,\" trade body confirms UK law has required metric weights for retail sale since 1995, regardless of EU membership before or after Brexit"
- "The Cultural Policy Foundation hails a pub's continued use of the phrase \"local bitter\" on its chalkboard as \"a defiant post-Brexit act of linguistic sovereignty,\" landlord confirms the phrase has been written there, unchanged, since the pub opened in 1987"
- "A hospital's new \"Digital Front Door\" initiative turns out to be a QR code taped to the existing front door, linking to a page listing visiting hours, trust calls it \"a step-change in patient-centred access\""
- "A GP surgery's \"Flexible Booking Revolution\" replaces its phone queue with an online form that is disabled by the system every day at 8:31am, surgery calls it \"empowering patients to take control of their care\""
- "Margaret Fenn's parish council spends £680 on a \"Bench Utilisation Study\" that concludes the village's two benches are \"adequately positioned,\" Fenn says the study was \"nothing against anyone, simply prudent stewardship\""
- "A district council's £18,000 \"Gateway Identity Project\" adds a single new planter beneath the existing road sign that already reads the town's name, council leader calls it \"a landmark moment for civic pride\""
- "A BBC regional current affairs programme's \"In Your Area\" debate segment is found to have booked the same retired councillor as its \"ordinary member of the public\" panellist eleven times in a row, producer calls it \"a trusted and familiar voice for viewers\""
- "A BBC daytime cookery show's live studio \"taste test\" reactions are revealed to have been recorded in a separate room an hour before broadcast, producer calls it \"a standard part of our production process\""
- "Gavin Bacon warns that a library's new Chinese-made umbrella stands \"could be mapping footfall for a foreign power,\" librarian confirms the stands are solid cast iron with no electronic components whatsoever"
- "An Albion Policy Foundation report calls a primary school's Chinese-manufactured recorders \"a stark vulnerability in the nation's music education supply chain,\" head teacher says the recorders have been handed down, class to class, since 2009 without incident"
- "A discount retailer's \"Budget Basket Promise\" holds its headline price while cutting the teabag count in its own-brand box from 80 to 64, retailer calls the change \"optimised brewing proportions\""
- "A building society's new \"Household Resilience Line\" turns out to connect callers to a pre-recorded message reciting the society's standard overdraft terms, society calls it \"a compassionate addition to our member services\""
- "A police force's \"Operation Vigilant Eye\" installs a single dummy camera outside a row of shops that had already gone three years without a reported break-in, force calls it \"a proactive, intelligence-led deterrent\""
- "A bowls club renames its \"Skip\" role \"Lead Strategic Wellbeing Facilitator\" after an inclusivity review, members report the new title will not fit on the clubhouse scoreboard and now overlaps the sponsor's logo for Fenwick's Garden Supplies"
