- "Gerald writes to his MP demanding to know why a disused Harvester earmarked as an asylum reception centre has \"no proper carvery,\" building's former owner confirms it closed in 2019 and the \"carvery\" in question is a single microwave"
- "Gavin Bacon blames a cut to local cinema screening times on \"asylum backlog pressures,\" cinema manager says the real cause is a broken digital projector bulb awaiting a replacement part"
- "Garden centre's switch to a smaller plant pot is denounced online as \"Brussels regulating Britain's begonias,\" owner says the smaller pot is simply cheaper to ship from a Yorkshire supplier, Brussels having had no say over UK garden centres since 2020"
- "Bakery's shrinking bread rolls are branded \"Brussels shrinking Britain's loaf\" in a local Facebook group, baker says it's down to a flour price rise, the EU having had no regulatory reach over UK bakeries for six years"
- "Hospital's new \"patient journey mural\" turns out to be a single laminated poster taped to a corridor wall, trust says the mural \"elevates the healing environment\""
- "GP surgery's new \"digital-first\" online triage tool is found to direct every single query to \"please call 111,\" surgery calls the system \"a modern front door to care\""
- "Margaret Fenn's parish council spends £3,000 renaming the village duck pond a \"Blue Wellbeing Space,\" pond, ducks, and depth entirely unchanged, Fenn says the move is \"nothing against anyone, simply modern best practice\""
- "Borough council unveils its \"flagship high street regeneration,\" understood to consist of one new bench, council calls it \"a bold vision for the town centre\""
- "BBC quiz show's \"accessibility overhaul\" turns out to be a slightly larger font on the studio scoreboard, viewers call the timing \"pointed,\" producer says it \"widens participation for all\""
- "BBC local news \"investigation\" into a pothole is confirmed to be the same pothole first reported eight months ago, now two inches deeper, broadcaster describes the piece as \"ongoing coverage\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns a town's new Chinese-made litter bins \"could be gathering data for Beijing,\" council confirms the bins contain no electronics, only a foot pedal"
- "Albion Policy Foundation report warns a popular Chinese-made karaoke machine sold in UK homes \"may represent a national security vulnerability,\" retailer says the machine has no internet connection and its only function is playing backing tracks"
- "Supermarket's \"price freeze pledge\" is confirmed to apply solely to one own-brand teabag line, chain calls it \"a stand against the cost of living\""
- "Energy supplier's new app badge promising \"lower bills\" turns out to simply reorder the same tariff information on screen, supplier calls it \"greater transparency for customers\""
- "Police force's new \"anti-social behaviour taskforce\" is confirmed to be one officer covering four towns on alternating Tuesdays, force calls it \"a visible and proactive presence\""
- "Office's new \"inclusive language guide\" bans staff from using the word \"guys\" in emails, replacement term \"team\" quietly dropped the same week for being \"insufficiently warm,\" HR calls the process \"a meaningful step forward\""
