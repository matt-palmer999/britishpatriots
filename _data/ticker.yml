- "Gerald writes to his MP demanding to know why a \"fleet of unmarked white vans\" has been idling outside the community centre every Saturday morning, centre manager confirms it is the car boot sale committee loading tables at 7am"
- "A seaside town's new multilingual welcome sign at the station is denounced online as \"proof the town has been quietly resettled,\" council confirms the sign has displayed the same four languages, unchanged, since 2009 for the benefit of day-trip coach tours"
- "A butcher's new EU-style oval price labels are denounced by a regular as \"Brussels sneaking its shapes back onto our meat counter,\" butcher says the labels are simply what came free with his new till roll supplier, Brussels having had no authority over British meat labelling shapes since 2020"
- "A village cricket club's new scoreboard, painted pale blue and gold, is denounced by a passing motorist as \"an EU flag hiding in plain sight on the green,\" club treasurer says the colours were simply what was left over from the pavilion fence"
- "A hospital trust's new \"Patient Journey Excellence Charter\" is found to consist of the existing appointment letter reprinted in a slightly larger font, trust calls it \"a bold reaffirmation of our commitment to clarity\""
- "A GP surgery's \"24-Hour Care Promise\" turns out to mean a recorded message, available around the clock, directing callers to ring back during opening hours, practice calls it \"a continuous commitment to patient access\""
- "Margaret Fenn's parish council commissions a £2,340 \"Hedge Height Consistency Audit\" that finds the hedge is, and should remain, the height it already is, Fenn insists the audit was \"nothing against anyone, simply due diligence\""
- "A district council's £45,000 \"Riverside Renewal Vision\" concludes, after a year of consultation, in the installation of two new benches facing the river they already faced, council leader calls it \"a transformative step for the waterfront\""
- "A BBC daytime quiz show's \"major format shake-up\" is confirmed to be the removal of one on-screen clock graphic, broadcaster calls it \"a bold creative reinvention for a new era of the programme\""
- "Col. (Ret'd) Brian Fortescue-Hatch accuses a BBC nature documentary of \"undermining British resolve\" by subtitling a badger's grunt as \"concerned,\" producers confirm the subtitle is standard accessibility captioning used across the entire series"
- "A town's new Chinese-made recycling sorting arm is warned by the Cultural Policy Foundation to \"represent a stark risk to sovereign waste data,\" waste depot manager confirms the arm is mechanical, unpowered by software, and simply pushes bins along a chute"
- "Gavin Bacon demands an inquiry after a primary school orders Chinese-made recorders for its music lessons, calling it \"a stark vulnerability at the heart of our children's education,\" headteacher confirms the recorders are plastic, cost 90p each, and play no notes once broken"
- "A high street coffee chain's \"Fair Price Pledge\" is found to apply solely to its smallest filter coffee, unchanged in price since the pledge launched, chain calls it \"clear evidence of our pricing integrity\""
- "A regional energy supplier's \"Winter Warmth Guarantee\" turns out to be a single email reminding customers to wear a jumper, supplier calls it \"a proactive step in supporting households through the colder months\""
- "A police force's \"Community Reassurance Initiative\" is confirmed to be one community support officer walking the same half-mile route once a fortnight, force calls it \"a highly visible and proactive deterrent\""
- "A café is reported to the council after a customer complains its new \"seasonal\" cup design, featuring holly and a robin, \"erases the true meaning of winter,\" café owner confirms the design has been used every November since 2017 and contains no religious or political content whatsoever"
