- "Home Office trials \"biometric wristbands\" for asylum seekers on day-release from reporting centres, first batch of alerts sent to a reporting centre two counties away due to a postcode mix-up"
- "Gerald writes to his MP to complain that the new reception centre's perimeter fence is in better condition than his own garden fence, MP's office thanks him for his \"continued engagement\""
- "British vineyard voluntarily adopts an EU-style appellation label to secure a listing with a French supermarket chain, Gavin Bacon calls it \"surrender dressed as a sticker\""
- "Albion Policy Foundation report warns that British biscuit packet sizes are \"converging\" with EU norms after three manufacturers switch to a metric-friendly tray, findings described as \"stark\""
- "NHS trust unveils a \"digital twin\" of its A&E waiting room so patients can watch an animated version of the queue on their phones, average wait unaffected"
- "Rural pharmacy switches repeat prescriptions to an app-only booking system \"to cut paperwork,\" pharmacist reports half the regulars now need their grandchildren to collect for them"
