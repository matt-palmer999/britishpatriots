- "Gerald writes to his MP after spotting a removal van outside a neighbouring house, convinced it signals \"a planned population shift\" on his road, van turns out to belong to a single family relocating from two streets over for a bigger garden"
- "A village's new noticeboard, translated into \"three extra languages,\" is denounced online as \"erasing English identity,\" parish clerk confirms the three languages are Welsh, Cornish, and Scots Gaelic, added at the request of a local heritage society"
- "Gavin Bacon claims a supermarket's new \"best before\" date format is \"Brussels creeping back through the back door,\" supermarket confirms the format has been used on British packaging since before 1973 and has never been changed"
- "A Cultural Policy Foundation report hails a town's continued sale of beer in pints as \"a hard-won Brexit freedom,\" pub landlord confirms nothing about pint sales has changed since before Britain joined the EEC"
- "A GP surgery's \"Same Day Access Promise\" turns out to guarantee only a same-day voicemail confirming no appointments are available, surgery calls it \"a modern commitment to patient communication\""
- "A hospital car park's new \"Patient Priority Bays\" scheme reserves the two bays nearest the entrance, which were already disabled bays, with a new sign bolted on top, trust calls it \"a bold step forward in patient experience\""
- "Margaret Fenn's parish council spends £940 on a \"Community Signage Audit\" that recommends no changes to any of the village's existing signs, Fenn says the audit was \"nothing against anyone, simply good housekeeping\""
- "A borough council's £15,000 \"Market Square Vibrancy Strategy\" results in the square's existing six stalls being repainted the same colour they already were, council leader calls it \"a transformative vision for the town centre\""
- "A BBC regional radio phone-in's \"Should We Bring It Back?\" vote on scrapping a roundabout receives two texts, both from the same number, presenter calls it \"an overwhelming response from listeners\""
- "A BBC daytime quiz show's \"ask the audience\" segment is revealed to have used a recording of applause from a 2019 episode for the past eighteen months, producer calls it \"a seamless part of the show's identity\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-made smart kettle \"could be relaying boil times to foreign servers,\" manufacturer confirms the kettle has no wireless chip and simply switches off via a basic thermostat"
- "A Cultural Policy Foundation report calls a seaside pier's Chinese-manufactured deckchairs \"a stark vulnerability in the nation's leisure infrastructure,\" pier manager says the deckchairs have simply been folded away in the same shed every winter since 2011"
- "A high street chain's \"Everyday Value Guarantee\" holds the price of its basic loaf while cutting the slice count from 20 to 17, chain calls the change \"freshness-optimised portioning\""
- "An energy supplier's \"Winter Warmth Promise\" turns out to apply only to customers who have already switched tariffs twice this year, supplier calls it \"a targeted reward for engaged customers\""
- "A police force's new \"Community Reassurance Patrol\" consists of a single community support officer walking the same half-mile route once a fortnight, force calls it \"a highly visible deterrent\""
- "A cricket club renames its \"Groundsman\" role \"Turf Wellbeing Lead\" after a diversity review, members report the new title has been printed on the clubhouse honours board one line too long, now overlapping the sponsor's logo for Woodfield's Turf & Loam"
