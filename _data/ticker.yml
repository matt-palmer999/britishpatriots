- "Coastal town's \"community cohesion fund\" pays for a single hanging basket outside the old leisure centre now housing asylum seekers, council leader calls it \"a tangible sign of welcome\""
- "Gerald writes to his MP demanding to know why a disused Travelodge \"due to house migrants\" has stood empty for eight months, planning records show no application has ever been submitted"
- "Gavin Bacon tells a radio phone-in that a supermarket's shrinking Swiss roll is \"exactly the kind of thing Brussels would love,\" manufacturer confirms the recipe change was made at its factory in Wales to cut costs"
- "Village pub's new smaller pint glasses are denounced online as \"an EU plot finally landing,\" landlord says he bought them from a wholesaler in Hull because the old ones kept breaking"
- "NHS trust's new \"digital front door\" initiative turns out to be a single iPad bolted to the wall of A&E reception, iPad has been offline for three weeks"
- "GP surgery's \"extended hours pilot\" adds one Tuesday evening appointment slot, booked eleven minutes after going live and not available again until next year"
- "Margaret Fenn's parish council spends £1,200 renaming the recreation ground \"Albion Fields\" on the grounds it sounds \"more patriotic,\" recreation ground remains the same patch of grass with a broken swing"
- "Borough council's new \"net zero taskforce\" meets twice a year by video call and has so far produced one laminated poster, taskforce chair says progress is \"on track\""
- "BBC daytime quiz show apologises after a question wrongly states the capital of Wales is Swansea, broadcaster says the error will be \"addressed in due course\" and the episode remains on iPlayer uncorrected"
- "BBC local news segment on \"Britain's wildflower meadows\" is filmed on a roundabout verge that was mown flat the previous week, producer says the footage still \"captures the spirit\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a primary school's new Chinese-made recorder set \"could be used to monitor classroom conversations,\" manufacturer confirms the recorders are musical instruments with no electronic parts"
- "Market town rejects a Chinese company's offer to resurface its crumbling high street car park after a councillor warns of \"a foothold in tarmac,\" car park has had potholes unrepaired for four years"
- "Cultural Policy Foundation report finds shoppers now walk \"14% further\" around supermarkets since aisles were reorganised for \"wellbeing flow,\" findings described as \"stark\""
- "High street bank's new \"simplified fee structure\" introduces four new fee categories to replace two existing ones, bank says the change \"reduces complexity for customers\""
- "Police force's new \"visible policing pledge\" delivers one extra foot patrol a month to a town centre, patrol consists of a single officer and lasts twenty minutes"
- "University's new \"inclusive language guidance\" renames the staff canteen's \"builder's breakfast\" the \"hearty morning plate,\" menu and price unchanged, canteen manager says the change reflects \"ongoing review\""
