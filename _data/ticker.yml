- "Gerald writes to his MP claiming a fleet of unmarked minibuses outside the leisure centre are \"ferrying asylum seekers under cover of darkness,\" centre manager confirms the minibuses belong to a touring five-a-side football tournament running until Sunday"
- "Gavin Bacon claims a market town's multilingual welcome sign at the station \"proves two-tier Britain has arrived,\" train operator says the sign has displayed the same four languages, unchanged, since 2011"
- "A campsite's switch to metric tent-peg sizing is denounced online as \"Brussels dictating British camping,\" supplier says the change follows a factory switch in Yorkshire, the EU having had no authority over UK tent pegs for six years"
- "A greengrocer's decision to sell bananas in bunches of five instead of six is branded \"an EU banana diktat\" by a local Facebook group, owner says the change reflects a price rise from his wholesaler, Brussels having had no say over the shape or bunch size of British bananas since 2020"
- "A dentist surgery's new \"Oral Wellness Pathway\" turns out to be the same six-month waiting list with a leaflet added to the window, practice says the pathway \"empowers patients to understand their position in the queue\""
- "A hospital's \"Rapid Response Innovation Hub\" is confirmed to be a repurposed stationery cupboard with a kettle and two chairs, trust says the hub \"reflects our ambition to do things differently\""
- "Margaret Fenn's parish council spends £1,950 on a \"Heritage Signage Audit\" that recommends the war memorial sign stay exactly where it has stood since 1947, Fenn says the audit was \"nothing against anyone, simply due diligence\""
- "A borough council's \"landmark public realm investment\" turns out to be four new litter bins and a repainted bollard outside the Wetherspoons, council calls it \"a bold reimagining of the town centre\""
- "A BBC regional news bulletin's \"major rebrand\" is confirmed to be the same presenters in the same studio with a slightly bluer backdrop, viewers call it \"a clear ideological shift,\" producer says it \"modernises our visual language\""
- "BBC Radio's \"in-depth probe\" into a flickering streetlight is confirmed to be a single email to the council, first sent in April, broadcaster describes the piece as \"an evolving investigation\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a village hall's new Chinese-made kettle \"could represent a strategic vulnerability,\" hall committee confirms the kettle boils water and has no internet connection of any kind"
- "Albion Policy Foundation report warns a seaside pier's Chinese-made deckchairs \"may be mapping the coastline,\" pier operator says the deckchairs are canvas and wood and fold up for storage each winter"
- "A discount supermarket's \"Locked Low Prices\" pledge is found to apply to a single jar of own-brand instant coffee, chain says the pledge \"reflects our unwavering focus on helping families\""
- "A broadband provider's new \"Transparent Tariff\" is found to include a £4 monthly \"service continuity fee\" not shown in the advertised price, provider calls it \"a clearer way to understand your bill\""
- "A police force's \"high-visibility town centre operation\" is confirmed to consist of one community support officer stood outside a bank for half an hour on a Wednesday, force calls it \"a proactive and reassuring presence\""
- "A village fete renames its \"Best in Show\" marrow category the \"Finest Marrow Recognition,\" judging criteria, trophy, and judges entirely unchanged, committee says the rename \"makes the category feel inclusive to all growers\""
