- "Home Office's new small boats \"deterrence dashboard\" tracks Channel crossings in real time, dashboard turns out to be a spreadsheet an intern refreshes manually once a week, department calls it \"proactive monitoring\""
- "Gerald writes to his MP to demand why the new arrivals centre's noticeboard is printed \"in three languages before English,\" MP's office notes English appears first in all three, in bold, twice"
- "Gavin Bacon warns a supermarket's new \"continental cheese aisle\" is \"Brussels creeping back through the fridge door,\" supermarket confirms the cheese is from Somerset and the sign was a printing error"
- "Albion Policy Foundation report finds British queueing has become \"measurably less orderly\" since a Dutch-style bicycle rack was installed outside a Norwich station, findings described as \"stark,\" rack has four spaces"
- "NHS trust advertises a new \"patient experience ambassador\" role on £58,000 a year to stand in the foyer and point people to the toilets, advert specifies \"no clinical background required or desired\""
- "Hospital's new online booking system requires patients to register an account, verify their email, and complete a satisfaction survey about the booking system before showing any appointments, taken offline after booking its own IT consultant twice"
- "Margaret Fenn's parish council votes to rename the duck pond a \"biodiversity asset\" following a £12,000 consultant's report, ducks unavailable for comment, Fenn says she has \"nothing against ducks\""
- "Borough council unveils its new \"net zero fleet,\" found to be the same three diesel vans with a leaf sticker added to each door, spokesman calls it \"a visible first step\""
- "BBC commissions a six-part documentary asking \"What Does It Mean To Be British Today?\", series cancelled after five episodes fail to agree, final slot filled by a repeat of a gardening programme"
- "BBC Radio phone-in asks listeners \"Has woke gone too far?\" and takes 400 calls, 390 of which are about a pothole, presenter calls it \"a nation speaking as one\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns a Chinese-made kettle in the officers' mess \"could be reporting tea preferences to Beijing,\" regiment confirms the kettle has no wifi chip and was bought from a market stall in 2014"
- "Seaside town cancels a twinning ceremony with a Chinese port city after a councillor warns of \"soft power through bunting,\" no bunting has yet been ordered by either side"
- "Chancellor unveils a \"cost of living clarity drive\" requiring supermarkets to display price-per-unit in larger font, font found to be one point size bigger, supermarket calls it \"a meaningful step\""
- "High street bank's new \"financial wellbeing hub\" replaces its last human cashier with a tablet bolted to the counter, customers queue for the tablet in the same queue as before"
- "Police force's new \"community confidence survey\" finds residents feel safer, survey conducted entirely in the police station waiting room during opening hours"
- "University renames \"Freshers' Week\" the \"Welcome Period\" after a review finds the word \"week\" \"implies a rigid temporal structure,\" Welcome Period lasts exactly one week"
