- "Home Office's new \"digital triage\" portal for asylum claims offers a nationality dropdown listing only European countries, caseworkers told to select \"Other\" and attach a handwritten note, department says the list \"will be expanded in due course\""
- "Gerald writes to his MP demanding to know why the asylum hotel's weekly skip collection uses \"a bigger lorry\" than his own street's, MP's office confirms it is the identical lorry on the identical round, photographed from a different angle"
- "Gavin Bacon blames \"Brussels red tape\" for a Grimsby trawler being held at the quayside over missing paperwork, harbourmaster confirms the form is a British landing declaration unchanged since 1995"
- "Cultural Policy Foundation report finds British pub conversation has grown \"measurably more hesitant\" since a Spanish tapas night launched once a month at one Shropshire pub, findings described as \"stark\""
- "NHS trust's new mental health helpline cuts its call-waiting music after a review finds it \"too calming,\" replacement track described by callers as \"exactly the same, slightly louder\""
- "Hospital car park's new \"patient priority\" barrier requires a six-digit code texted on arrival, texts arrive an average of eleven minutes after entry, trust calls the system \"responsive\""
- "Margaret Fenn's parish council approves a \"dark skies policy\" banning new outdoor lighting, approved at the same meeting as a floodlit noticeboard announcing the policy, Fenn says she has \"nothing against darkness\""
- "Borough council's new \"digital inclusion strategy\" is published only as a 40-page PDF on a website that fails the council's own accessibility checker"
- "BBC's new flagship current affairs strand opens with a studio discussion titled \"Can Britain Still Disagree Well?\" that is cut short after two guests refuse to continue filming together"
- "BBC regional bulletin's \"your news, your way\" personalisation feature shows every viewer in the region the identical three stories, engineer says the postcode field \"isn't wired up to anything yet\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-made smart streetlamp on his road \"could be reporting dog-walking patterns to Beijing,\" council confirms the lamp has been stuck on \"amber fault\" since installation"
- "University suspends talks on a Chinese-funded research partnership after a governors' motion warns of \"strategic exposure,\" the partnership was for a joint study of canal lock erosion"
- "Chancellor's new \"household energy clarity charter\" requires bills to state the average cost \"in plain English,\" the average is now printed in a font small enough to need the bill's own magnifying insert"
- "Supermarket's \"everyday low prices\" relaunch coincides with thirty products shrinking by an average of 8%, press office calls the overlap \"unrelated timing\""
- "Police force's new \"digital first\" reporting tool for shoplifting logs a case automatically as \"resolved\" the moment the online form is submitted, force says the status \"refers to the form, not the crime\""
- "Theatre's panto rewrites \"Widow Twankey\" as \"Laundry Custodian Twankey\" following a sensitivity read, script and costume otherwise unchanged, audience survey records no complaints about the original title"
