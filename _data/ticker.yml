- "Home Office unveils a new \"integration passport\" requiring asylum seekers to attend three community events a month, local church hall says it now hosts more Home Office paperwork than actual congregants"
- "Council converts a disused leisure centre into asylum accommodation and unveils a mural in the foyer before fixing the boiler that's been broken since March"
- "Supermarket chain adds a voluntary \"EU-style\" nutrition label to its own-brand crisps to ease exports through Dublin, Gavin Bacon calls it \"Brussels creeping back in through the snack aisle\""
- "Cultural Policy Foundation report warns British recycling bins are \"converging\" with EU colour-coding purely by coincidence, findings described as \"stark\""
- "NHS trust introduces a mandatory \"wellbeing walk\" for staff between shifts, rota gap filled by asking remaining nurses to cover two wards at once"
- "GP surgery installs a self-service check-in kiosk to \"reduce waiting times,\" patients report it has simply relocated the queue to in front of the kiosk"
- "Margaret Fenn's parish council votes to commission a feasibility study into whether the village needs a feasibility study officer, Fenn insists she has \"nothing against efficiency\""
- "Council spends £40,000 rebranding its car park signage from \"Pay and Display\" to \"Pay and Display: A Journey,\" motorists report the machine still only accepts coins"
- "BBC's in-house diversity panel reviews scripts for \"regional accent representation,\" first note sent back asks a Yorkshire drama to \"soften its own accents\""
- "BBC local radio station cuts its final afternoon phone-in show, replaces it with a national podcast feed, presenter says listeners can now \"engage\" via a form nobody reads"
- "Col. (Ret'd) Brian Fortescue-Hatch pens a furious column on a Chinese-owned solar farm visible from his study window, it emerges the land is his own and he signed the lease himself"
- "Port authority confirms a Chinese logistics firm now manages one of its container cranes, opposition MP calls it \"a national security gap you could drive a lorry through,\" port says the crane mostly lifts fish crates"
- "Chancellor unveils a \"Buy British\" loyalty scheme offering shoppers points redeemable only on products already made in Britain, uptake described as \"modest\""
- "High street bank closes its last branch in a market town, replaces it with a \"community banking pod\" open two hours a week that doesn't take cash"
- "Police force launches a \"reassurance patrol\" app showing residents a live map of officers, map shows most officers clustered around the station car park during a break"
- "University students' union votes to rename its \"Freshers' Fair\" to \"Welcome Fair\" over the original name's \"unclear inclusivity metrics,\" stalls still sell the same branded lanyards"
