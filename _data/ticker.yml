- "Home Office's new \"fast-track\" asylum decision unit processes its first case in record time by rejecting the form for being stapled \"incorrectly,\" applicant told to resubmit"
- "Council houses a family of asylum seekers above a disused chip shop, Gerald writes to his MP to complain about \"the smell,\" MP's office confirms the chip shop has been closed for six years"
- "Gavin Bacon demands an \"immigration cap with teeth,\" Reform press office later clarifies he meant a numerical limit and not, as one regional paper reported, dentistry"
- "Port authority reports a lorry was briefly held for a \"rules of origin\" check despite carrying only British apples grown and boxed in Kent, Gavin Bacon calls it \"Brussels overreach\""
- "Albion Policy Foundation report finds \"stark\" evidence that British queuing speed has slowed since a Dutch supermarket chain opened a branch in Kent, queue timed by a single intern with a stopwatch"
- "NHS trust's new \"wellbeing hub\" app sends staff a daily reminder to take their lunch break, reminder itself scheduled during the only hour most staff can take lunch"
- "Ambulance trust's new call-sorting algorithm reclassifies a broken hip as \"routine\" after the patient describes the pain as \"manageable,\" trust says the system is \"learning\""
- "Margaret Fenn's parish council agrees to \"review\" the village's single speed bump after a resident's complaint, review scheduled for eighteen months' time, Fenn says she has \"nothing against speed bumps\""
- "Town council spends £40,000 rebranding its website as \"digital first,\" old website remains online and still the only one that works, new one requires a login nobody has been issued"
- "BBC regional news apologises for a weather map that showed rain over a town during a dry spell, correction broadcast during an actual thunderstorm in the same town"
- "BBC's new \"diversity of thought\" panel show books six guests who all agree with each other about the importance of disagreement, producer calls the episode \"robust debate\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a Chinese-owned app's \"smart\" fridge light \"could be signalling submarines,\" appliance maker confirms the light is a basic LED with one setting"
- "University pauses a joint research project with a Chinese partner institution after a shared spreadsheet briefly showed the wrong currency symbol, vice-chancellor calls it \"a serious data matter\""
- "Supermarket's \"value range\" packaging is redesigned to look cheaper, ingredients and price unchanged, chain reports a 12% rise in customers \"feeling like they're saving\""
- "Police force's new knife-crime \"early intervention\" van is deployed to a town with no reported incidents that month, officers spend the shift handing out leaflets to each other"
- "Local theatre renames its \"interval\" a \"pause for reflection\" after a single complaint about the word's \"colonial undertones,\" box office confirms the gap is still exactly fifteen minutes and still for the bar"
