- "Home Office's new \"welcome pack\" for asylum seekers contains a laminated map of local bus routes, caseworkers say it's the only item migrants \"actually ask for twice\""
- "Gerald writes to his MP after spotting \"unusual flags\" fluttering outside a migrant reception centre, council confirms they're leftover bunting from a primary school sports day in July"
- "Gavin Bacon blames \"Brussels bureaucracy\" for his local pub losing its beer garden heaters, landlord clarifies they were sold to cover a VAT bill, a tax Brussels has had no say over since 2020"
- "Cultural Policy Foundation report finds British punctuality has \"measurably slipped\" since a Portuguese bakery opened next to the train station, findings described as \"stark\""
- "NHS trust's new \"patient empowerment\" leaflet invites patients to \"self-triage\" in the waiting room using a laminated flowchart, flowchart's only two outcomes both read \"please continue waiting\""
- "Dentist's \"transparent pricing\" promise breaks a filling down into nine separate line items, final total identical to the old one-line invoice"
- "Margaret Fenn's parish council approves a \"community listening project,\" project consists of a suggestions box bolted to a wall nobody can reach without a stepladder, Fenn says she has \"nothing against stepladders\""
- "Borough council's new \"resident engagement portal\" requires a 14-digit reference number, the number issued only by post, which the portal was meant to replace"
- "BBC flagship documentary on \"the lost art of conversation\" turns out to be four presenters talking over one another for fifty minutes"
- "BBC local radio phone-in on \"whatever happened to common sense\" is cut short after the only caller to get through turns out to be the producer's father"
- "Col. (Ret'd) Brian Fortescue-Hatch warns a Chinese-made smart bird feeder in his garden \"may be logging flight patterns for Beijing,\" feeder confirmed to have not dispensed seed since its battery died at Easter"
- "Town council shelves a Chinese-financed bandstand repair over \"strategic acoustic concerns,\" bandstand has had no working roof since a storm in 2021"
- "Chancellor's new \"cost of living toolkit\" consists of a downloadable spreadsheet for tracking rising bills, spreadsheet itself requires a paid subscription to open in full"
- "Supermarket's \"value promise\" range swaps its own-brand teabags for a box with twenty fewer bags, box now marked \"refreshed recipe\""
- "Police force's new \"community reassurance\" scheme hands out fridge magnets printed with a non-emergency number, number redirects callers to a hotline that closed for \"restructuring\" in March"
- "Leisure centre renames its \"parent and toddler\" swim session the \"intergenerational wellbeing swim,\" times, pool temperature and armbands all unchanged, organiser calls the change \"meaningful\""
