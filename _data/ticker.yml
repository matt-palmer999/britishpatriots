- "Gerald writes to his MP demanding to know why a disused scout hut earmarked for asylum overflow housing has \"no separate dining room,\" council confirms the hut hasn't hosted scouts in nine years and the \"dining room\" in question is a single folding table"
- "Gavin Bacon blames a lengthening queue at the post office on \"record small boat crossings,\" postmaster says the queue is down to one self-service machine being out of order since Tuesday"
- "Pub's switch to paper straws is branded \"Brussels banning plastic again\" online, landlord says the switch was his own cost-cutting decision, with the EU having had no regulatory reach over UK pubs since 2020"
- "Chip shop's switch to a smaller wrapping paper size is denounced by a customer petition as \"a Brussels plot to shrink the British portion,\" owner says the paper was simply cheaper in bulk from a Grimsby supplier, Brussels having had no authority over UK chip shops for six years"
- "Hospital's new \"Wellbeing Garden\" turns out to be three potted plants on a corridor windowsill, trust says the garden \"transforms the patient environment\""
- "Dentist surgery's new appointment booking app crashes on every attempt to book, practice manager says the app \"modernises patient access\""
- "Margaret Fenn's parish council renames the village notice board a \"Community Information Hub,\" board, pins, and opening hours entirely unchanged, Fenn says the move \"nothing against anyone, simply modern best practice\""
- "Borough council's \"listening exercise\" on a proposed roundabout receives a single response, filed by the council's own highways officer under a pseudonym, council calls the result \"a clear public mandate\""
- "BBC property makeover show's \"diverse casting drive\" is reported after a fourth presenter joins its three-person rotating panel, viewers call the timing \"pointed,\" producer says it was \"planned before filming began\""
- "BBC local radio's new jingle, costing £45,000, is confirmed to use the same four notes as the one it replaced, played at a slightly slower tempo, broadcaster says it \"reflects a bolder sound\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns a town's new Chinese-made streetlights \"could be monitoring residents for Beijing,\" council confirms the lights contain no cameras, only a timer-based dimmer"
- "Albion Policy Foundation report warns a popular Chinese-made smart kettle sold in UK homes \"may represent a national security vulnerability,\" manufacturer says the kettle's only function is boiling water and it has no network connection"
- "Supermarket's \"value range\" relaunch renames 40 products with no change to price or recipe, chain says the relaunch \"puts more money back in customers' pockets\""
- "Cultural Policy Foundation report finds commuters are spending \"22% longer\" checking train delay apps since a rail operator redesigned its app interface, findings described as \"stark\""
- "Police force's new \"community reassurance van\" is confirmed to be parked in the same supermarket car park every day, rarely staffed, force says the van \"provides visible presence\""
- "Primary school renames its \"Christmas Fair\" the \"Winter Celebration,\" date, stalls, and mince pies entirely unchanged, headteacher says the rebrand \"is more inclusive for all families\""
