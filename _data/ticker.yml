- "Council's new \"refugee integration hub\" turns out to be a repurposed shipping container with one kettle and a stack of leaflets, council leader says it \"sends the right message about openness\""
- "Gavin Bacon demands an urgent inquiry after hearing a seafront hotel is \"fully booked out for asylum seekers,\" hotel manager confirms the booking is a darts tournament running until Sunday"
- "Petrol station's new queueing barriers are denounced online as \"Brussels red tape dripping onto the forecourt,\" station owner says they were fitted by a local fencing firm to stop people parking across the pumps"
- "Deli counter's smaller cheese wedges are hailed online as proof of \"Brussels portion control finally exposed,\" cheesemonger says the new size was his own decision to cut down on waste, since no EU rule has applied in Britain for six years"
- "Hospital trust's new \"patient experience survey\" offers two options, \"good\" and \"very good,\" trust says the format ensures \"consistently positive feedback\""
- "Ambulance trust unveils \"rapid response\" livery for three vehicles that have been off the road awaiting repair since April"
- "Margaret Fenn's parish council votes to twin the village with itself after talks with a French town collapse over \"logistics,\" noticeboard already updated"
- "Borough council's \"listening exercise\" on bin collection days closes to submissions nine hours after anyone is told it had opened, council says the response \"will inform future engagement\""
- "BBC Breakfast segment on \"the great British sandwich\" is re-edited after the only sandwich featured turns out to be a baguette filmed in Calais"
- "Local BBC radio phone-in on \"pride in Britain\" cuts to an advert break the moment the first caller starts expressing any, producer says timing was \"entirely coincidental\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns a market town's new Chinese-funded footbridge \"could be used to monitor river traffic,\" footbridge spans a stream two feet deep with no boats recorded using it in living memory"
- "Albion Policy Foundation warns a consignment of Chinese-made Christmas lights \"may be capable of transmitting data,\" trading standards inspection finds a blown fuse and nothing else"
- "Supermarket's \"value range\" relaunch shrinks tins of beans by 10 grams while adding the words \"Great British\" to the label, price unchanged"
- "Energy firm's new \"smart tariff\" charges its highest rate during the two hours smart meter data shows most customers are actually cooking dinner"
- "Police force's new knife crime \"taskforce\" consists of a single laminated poster bolted to a bus shelter, force says the poster \"forms part of a wider strategy\""
- "Golf club renames \"Ladies' Day\" to \"Inclusive Day,\" entry restrictions and tee-time allocations left completely unchanged"
