- "Gerald writes to his MP complaining that an asylum hostel's bin store blocks the view from his conservatory, council surveyor finds the bin store was built in 1987, nine years before the conservatory"
- "Home Office's new \"community cohesion liaison officer\" role is filled by relocating an existing officer from the complaints department, only the desk and the job title actually move"
- "Gavin Bacon claims a motorway speed camera rollout is \"Brussels-style surveillance creep,\" Highways England confirms the cameras are made in Newport and funded entirely by local parking fines"
- "Parish newsletter blames a chip shop's \"continental-style\" paper wrapping on \"incoming EU packaging rules,\" wrapping turns out to be leftover stock from a 2011 clearance sale"
- "GP surgery's new \"digital-first\" booking app requires patients to fax a form to receive their login code, practice manager says the fax machine is \"more reliable than the app\""
- "Ambulance trust unveils a staff \"wellbeing pod\" in the car park, pod turns out to be a repurposed shipping container with no door handle on the inside, trust calls it \"cosy\""
- "Margaret Fenn's parish council approves a \"community reflection hedge\" to replace the war memorial railings removed for repair four years ago, Fenn says she has \"nothing against railings\""
- "Town council's \"net zero action plan\" turns out to consist entirely of switching the streetlights off an hour earlier, residents report no change to the bill, only to visibility after 9pm"
- "BBC commissions a documentary on \"Britain's addiction to nostalgia,\" production reuses footage from a 1998 documentary on the same subject because it \"still felt current\""
- "BBC Question Time's \"ordinary voters\" audience is found to include three sitting councillors and a former parliamentary candidate, broadcaster calls the panel \"broadly representative\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns a Chinese-made school recorder \"could be listening in on primary assemblies,\" manufacturer confirms the recorder has no batteries, electronics, or microphone of any kind"
- "County council shelves a twinning agreement with a Chinese tech park after a backbench councillor warns of \"data sovereignty risk,\" the agreement's only prior activity was a newsletter nobody had opened since 2016"
- "Supermarket's \"everyday low prices\" campaign launches the same week as a price rise on the three items featured in its own adverts, spokesman calls the timing \"coincidental\""
- "Bank's new \"financial wellbeing\" text alerts remind customers they are overdrawn, each alert charged at £1.50, bank describes the scheme as \"proactive support\""
- "Police force's new \"community reassurance drone\" is grounded after a single flight over the high street, force confirms the camera was never switched on because \"nobody had the password\""
- "Students' union renames its \"Christmas Fair\" the \"Winter Celebration Fair,\" mince pies and carol singers unchanged, union confirms the change followed zero complaints but \"felt right\""
