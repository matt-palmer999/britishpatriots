- "Home Office's new \"arrival welfare checklist\" app for a reception centre flags a resident's request for a dentist appointment as a \"resource strain indicator,\" developer confirms the same flag triggers for any booking containing the word \"appointment\""
- "Councillor's warning that a nearby hotel has been \"earmarked\" for asylum housing turns out to be based on a planning notice for a loft conversion at a bed and breakfast two miles away, hotel confirms no contact from the Home Office at any point"
- "Supermarket's banana bunches shrink from six to five, aisle noticeboard blames \"lingering Brussels red tape,\" greengrocers' association confirms the change is a supplier price adjustment and Brussels has had no say over British banana bunches since 2020"
- "Cultural Policy Foundation report claims British road signs are being \"quietly Europeanised\" by the growing use of the word \"diversion,\" Highways England confirms the word has appeared on UK signage since the 1960s, findings described as \"stark\""
- "Col. (Ret'd) Brian Fortescue-Hatch declares a hospital's new \"patient experience\" survey, conducted entirely on paper, to be \"proof the NHS still has some fight left in it,\" trust confirms the paper version was brought in because the digital one kept timing out"
- "GP surgery's \"same day access\" pledge is found to mean patients can book a same-day call back to be told the earliest appointment is in nine days, pledge technically unbroken"
- "Margaret Fenn's parish council agrees to spend £2,100 on a \"heritage trail\" consisting of four laminated signs pointing at a bus shelter, Fenn says she has \"nothing against the bus shelter, as such\""
- "Borough council's \"citizen engagement\" budget of £60,000 is found to have been spent entirely on a single consultation evening attended by seven people, three of whom were council staff topping up the biscuit table"
- "BBC consumer affairs segment on \"Britain's cash crisis\" is filmed at a corner shop that has accepted contactless payment since 2015, shop removes its card machine for the afternoon at the crew's request"
- "Radio 4 discussion titled \"Whatever Happened to British Humour?\" runs for half an hour without a single joke, producer says the format was \"deliberately serious\""
- "Ring-road car wash chain under Chinese ownership is accused on a regional radio phone-in of \"mapping driveway layouts,\" chain confirms its only camera faces the till for change disputes"
- "Albion Policy Foundation warns a Chinese-manufactured school recorder used in music lessons nationwide represents a \"generational exposure risk,\" manufacturer confirms the recorder is a plastic tube with no electronic components, findings described as \"stark\""
- "High street chain's \"price freeze\" pledge on its £1 meal deal is found to apply only to a sandwich discontinued since March, rest of the range unaffected"
- "Gavin Bacon says a 20p rise in a parking app's booking fee is evidence Britain is \"being nickel-and-dimed into submission,\" operator confirms the fee covers card processing costs and has risen once in six years"
- "Gerald writes to his MP after his neighbourhood watch app logs a \"spike\" in suspicious vehicle reports, review finds all seven reports describe the same postman's van on its usual round"
- "Local museum's \"decolonising the tea room\" review recommends renaming the \"Victoria sponge\" to \"classic British sponge, regional variant,\" recipe, price and cake stand left entirely unchanged"
