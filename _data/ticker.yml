- "Gerald writes to his MP after spotting \"unusually long queues\" outside the town hall, insisting it's \"obviously\" asylum seekers registering for benefits, council confirms the queue is for the annual over-60s bus pass renewal day"
- "Gavin Bacon claims a seaside town's falling B&B occupancy proves \"asylum hotels are killing British tourism,\" tourism board says occupancy fell because the town's main attraction, a Victorian pier, has been closed for repairs since March"
- "A village pub's switch to a smaller pint glass is denounced online as \"Brussels shrinking the British pint,\" landlord says the glass change follows a supplier error that sent the wrong size by mistake, Brussels having had no authority over UK pint measures since 2020"
- "Online complaints brand a bakery's slightly thinner Victoria sponge \"an EU directive on cake,\" owner says the change reflects a rise in the price of eggs from her usual supplier, the EU having had no regulatory reach over UK bakeries for six years"
- "Hospital trust's new \"Wellness Navigation Suite\" is confirmed to be a laminated poster taped to a corridor wall, trust says the suite \"empowers patients to self-direct their journey\""
- "GP surgery's new online booking system is found to offer only one appointment slot, in nine weeks' time, regardless of symptoms entered, practice calls it \"a more structured approach to demand\""
- "Margaret Fenn's parish council spends £2,400 commissioning a \"Community Voice Strategy\" that consists of a single suggestion box bolted to the village hall wall, Fenn says the move is \"nothing against anyone, simply giving people a voice\""
- "Borough council's \"flagship cycling infrastructure programme\" turns out to be two new bike racks outside the leisure centre, council calls it \"a transformational step for active travel\""
- "BBC daytime quiz show's \"fresh new look\" is confirmed to be a different coloured lectern, viewers call the change \"a clear ideological shift,\" producer says it \"better reflects the show's identity\""
- "BBC local radio's \"investigation\" into a pothole is confirmed to be a two-minute phone call to the council that was previously reported in July, station describes the piece as \"continuing coverage\""
- "Albion Policy Foundation report warns a town's new Chinese-made litter bins \"could be gathering data on residents' recycling habits,\" council confirms the bins are foot-pedal operated and contain no electronic components"
- "Col. (Ret'd) Brian Fortescue-Hatch warns a primary school's new Chinese-made whiteboards \"may be compromising national security,\" headteacher confirms the whiteboards are non-electronic and require a marker pen"
- "Supermarket's \"standing up to inflation\" campaign is confirmed to apply solely to one own-brand tin of baked beans, chain calls it \"a genuine commitment to value\""
- "Energy provider's new tariff named \"Simple Value Promise\" is found to cost £3 more per month than the tariff it replaced, provider calls it \"a clearer way to understand your bill\""
- "Police force's new \"community reassurance van\" is confirmed to visit each village once every six weeks for forty minutes, force calls it \"a highly visible deterrent\""
- "Leisure centre renames its \"Over-50s Gentle Exercise Class\" a \"Community Movement Circle,\" times, instructor, and attendees entirely unchanged, centre manager says the rebrand \"removes unhelpful labels\""
