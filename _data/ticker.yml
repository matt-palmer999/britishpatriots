- "Home Office's new \"cultural orientation\" walking tour for asylum seekers blasted as a \"taxpayer jolly,\" itinerary confirmed to be a 40-minute loop of a retail park ending at a branch of Greggs"
- "Gerald writes to his MP after spotting \"a van full of them\" outside the asylum hostel at 6am, hostel manager confirms the van belongs to the laundry contractor collecting sheets"
- "Gavin Bacon tells a Reform UK branch meeting that \"EU directives\" are to blame for a village's pothole backlog, council confirms the potholes are logged under a repair scheme that predates the referendum by a decade"
- "Albion Policy Foundation report finds British coat-queue etiquette has grown \"measurably more relaxed\" since a French cheese counter opened inside a department store, findings described as \"stark\""
- "NHS trust's new \"patient choice\" dinner menu offers four named options later confirmed to be the same shepherd's pie under four different printed titles"
- "GP practice's new triage chatbot refers every symptom typed, including \"slightly tired,\" to \"attend A&E without delay,\" practice says the bot is \"still learning\""
- "Margaret Fenn's parish council spends the village's entire noticeboard budget replacing the noticeboard with a sign reading \"noticeboard temporarily unavailable,\" Fenn says she has \"nothing against notices\""
- "Borough council's new \"paperless\" planning portal requires applicants to print, sign and post a form confirming they would like to apply paperlessly"
- "BBC's new daytime debate show \"Speak Your Mind\" cancelled after its studio audience is revealed to be the same twelve retirees bussed in from a nearby day centre each week"
- "BBC local news' \"your questions answered\" phone-in receives one call in its debut week, later traced to a researcher on the same programme"
- "Col. (Ret'd) Brian Fortescue-Hatch warns that his granddaughter's Chinese-made smart kettle \"could be listening for naval movements,\" manufacturer confirms the kettle has no microphone and struggles to boil below 90% full"
- "Council shelves a proposed Chinese investment in the town's derelict ice rink over \"national security concerns,\" the rink has stood closed since 2019 and its only prior backer was a local chip-shop owner"
- "Chancellor's new \"cost of living tracker\" app advertises weekly savings of \"up to £40,\" small print confirming the figure assumes giving up a daily takeaway coffee the user never bought"
- "High street chain's \"everything must go\" closing-down sale enters its fourteenth month, manager says the shop \"remains fully committed to closing\""
- "Police force's new \"rapid response\" unit logs its fastest callout time of 4 minutes, to an incident later confirmed as a seagull trapped in a bin"
- "Golf club renames its \"Captain's Day\" the \"Captain's Celebration Day\" following a single anonymous suggestion card, trophy, format and captain all unchanged"
