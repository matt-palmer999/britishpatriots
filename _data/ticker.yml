- "Home Office unveils a new \"integration passport\" for asylum seekers, laminated card turns out to be the standard local bus timetable with a Union Jack sticker added to the front"
- "Gerald writes to his MP demanding an \"investigation\" into the asylum hotel's breakfast buffet serving English muffins, hotel confirms the muffins come from the same bakery that supplies the Premier Inn next door"
- "Gavin Bacon claims a supermarket's resized egg box is \"an EU plot to shrink British omelettes,\" supermarket clarifies the box was resized in-house to cut cardboard costs"
- "Albion Policy Foundation report finds British queuing patience has \"measurably declined\" since a Belgian waffle van began visiting a seaside car park on Tuesdays, findings described as \"stark\""
- "NHS trust's new \"patient empowerment\" scheme lets patients name their own hospital bed, allocation still governed by the same waiting list regardless of what the bed is called"
- "Ambulance trust's new \"wellness check\" voicemail line asks callers in cardiac distress to \"press 1 for English, press 2 for Welsh,\" system crashes before reaching the option for an operator"
- "Margaret Fenn's parish council votes to rename the village duck pond a \"biodiversity feature,\" ducks, pond and feeding sign all unchanged, Fenn says she has \"nothing against ducks\""
- "Borough council's new \"digital first\" bin app sends a push notification reminding residents to put their bins out, reminder only unlocks via GPS once the resident is already standing next to the bins"
- "BBC flagship debate programme stages a special on \"the death of debate,\" episode pulled after its two invited guests agree with each other within ninety seconds"
- "BBC regional radio's \"community voices\" slot features the same caller for a third week running, producer insists it is \"a different listener with a similar accent\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns a Chinese-made garden gnome sold at a seaside gift shop \"could be surveilling the harbour,\" shopkeeper confirms the gnome has no electronic components and has already lost its fishing rod"
- "Town hall rejects a Chinese-backed bid to fix the leisure centre's leaking roof over \"sovereign infrastructure concerns,\" centre has operated under tarpaulin since 2021 with no other bidder in sight"
- "Chancellor unveils a \"household energy pledge\" guaranteeing bills \"won't rise this winter,\" small print confirms the guarantee applies only to households that switch their boiler off entirely"
- "Discount supermarket's \"value range\" relaunch prices a tin of beans 4p higher than the tin it replaces, spokesperson calls it \"a reset, not a rise\""
- "Police force's new \"community reassurance\" drone pilot spends its first month filming a single hedge after the operator loses the remote control, force calls the hedge \"fully monitored\""
- "University students' union renames its \"Freshers' Fair\" the \"Welcome Fair\" after a review, same stalls, same lanyards, same free pens, panel calls the change \"symbolically significant\""
