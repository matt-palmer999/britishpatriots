- "Gerald writes to his MP after spotting \"a minibus of silent men in hi-vis\" outside the business park at 6am, developer confirms they are contractors arriving for a dawn shift resurfacing the car park"
- "A seaside hotel is rumoured online to be \"secretly housing migrants\" after scaffolding goes up around it, hotel confirms the scaffolding is for re-pointing the chimney ahead of winter, with no change to its usual guest bookings"
- "A butcher's switch to pre-weighed metric mince portions is denounced online as \"Brussels portion control,\" butcher says the change follows a new fridge display from his supplier, the EU having had no authority over how British mince is weighed for six years"
- "A village's new road markings in a slightly brighter yellow are branded \"an EU paint directive\" in a local Facebook group, highways contractor says the paint is simply the newest UK-approved batch, Brussels having had no say over British road paint since 2020"
- "A GP surgery's new \"Patient Journey Lounge\" is confirmed to be the same waiting room with two armchairs swapped in for plastic chairs, practice says the lounge \"reimagines the patient experience from first contact\""
- "A hospital's \"24-Hour Rapid Access Hub\" is found to operate 9am to 5pm, Monday to Friday, trust says the name \"reflects our long-term ambition\" rather than its current opening hours"
- "Margaret Fenn's parish council spends £2,100 on a \"Community Benches Feasibility Study\" that recommends keeping the existing three benches exactly where they are, Fenn says the study was \"nothing against anyone, just good governance\""
- "A city council's \"transformational gateway scheme\" turns out to be a single new flowerbed and a planter outside the ring road roundabout, council calls it \"a statement of civic ambition\""
- "A BBC teatime magazine show's \"bold new era\" is confirmed to be the same two presenters with a new typeface on the title card, viewers call it \"a clear ideological rebrand,\" producer says it \"sharpens our visual storytelling\""
- "A BBC local news \"special investigation\" into a pothole is confirmed to be a single phone call to the council made in March, broadcaster describes the report as \"a developing story\""
- "Col. (Ret'd) Brian Fortescue-Hatch warns that a care home's new Chinese-made bingo caller \"could represent an intelligence-gathering device embedded in plain sight,\" home manager confirms the caller reads out numbered balls and runs on two AA batteries with no connectivity whatsoever"
- "Albion Policy Foundation report warns that a town's Chinese-made Christmas lights \"may be transmitting data back to Beijing,\" electrician confirms the lights are a basic string of LEDs with a plug and an on/off switch"
- "A discount chain's \"Price Promise Guarantee\" is found to apply solely to a single multipack of own-brand kitchen roll, chain says the guarantee \"underlines our relentless focus on everyday value\""
- "A mobile network's new \"Fair Price Tariff\" is found to include a £3.50 monthly \"network assurance charge\" absent from the advertised price, provider calls it \"a more transparent way to present your bill\""
- "A police force's \"intensified town centre crackdown\" is confirmed to consist of one laminated poster taped to a lamppost for a week, force calls it \"a strong, visible deterrent\""
- "A cricket club renames its \"Clubman of the Year\" award the \"Clubperson of the Year,\" trophy, criteria, and selection panel entirely unchanged, committee says the rename \"makes the award feel welcoming to everyone\""
